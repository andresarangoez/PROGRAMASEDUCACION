<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaso · Programas de Educación · FUCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>

/* VOICE: tutoría FUCS serena y segura; poco texto en pantalla, el guion completo vive en el celular.
   IDEA: diapositiva de congreso sobre la plantilla FUCS, iluminada por halos suaves que respiran.
   PICTURE: palabras clave grandes, fórmulas y esquemas que entran en cascada; divisores con chispas doradas.
   COLOUR and TYPE: blanco + azul FUCS #162654, azul #1f4fa3, dorado #e8b04a como luz; Raleway + Open Sans.
   LAYOUT: escenario 16:9 de 1280×720 escalado; vista #notas para el teléfono con guion y extras. */
:root{color-scheme:light;--navy:#162654;--blue:#1f4fa3;--sky:#eef3fb;--gold:#e8b04a;--goldl:#fdf5e6;--ink:#1d2433;--mut:#667089;--line:#e3e8f2;--ok:#1d7a52;--okl:#e6f5ee;--bad:#b23a3a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:16px/1.5 "Open Sans",system-ui,sans-serif;color:var(--ink);background:#0d1430;overflow:hidden}
#screen{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1280px;height:720px;background:#fff;position:relative;transform-origin:center;box-shadow:0 10px 50px rgba(0,0,0,.45);overflow:hidden}
.sl{position:absolute;inset:0;padding:100px 72px 56px;display:flex;flex-direction:column;overflow:hidden}
.sl>*{position:relative;z-index:1}
/* luces */
.sl .glow{position:absolute;z-index:0;border-radius:50%;filter:blur(60px);pointer-events:none}
.sl .glow.a{width:420px;height:420px;right:-140px;top:-160px;background:radial-gradient(circle,rgba(232,176,74,.30),transparent 70%);animation:drift 16s ease-in-out infinite alternate}
.sl .glow.b{width:520px;height:520px;left:-220px;bottom:-260px;background:radial-gradient(circle,rgba(31,79,163,.18),transparent 70%);animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-60px,40px) scale(1.15)}}
.logo{position:absolute;top:28px;left:44px;height:46px;z-index:2}
.sl h1{font:800 38px/1.1 Raleway,sans-serif;color:var(--navy);margin:0;text-wrap:balance;letter-spacing:-.3px}
.sl h1::after{content:"";display:block;height:6px;width:52px;border-radius:3px;margin-top:14px;background:linear-gradient(90deg,var(--gold),#ffe1a3,var(--gold));background-size:200% 100%;box-shadow:0 0 14px rgba(232,176,74,.7)}
.sl.in h1::after{animation:bar .9s .1s both,shine 3.5s 1s ease-in-out infinite}
@keyframes bar{from{width:0}to{width:52px}}
@keyframes shine{0%,100%{background-position:0 0;box-shadow:0 0 8px rgba(232,176,74,.5)}50%{background-position:100% 0;box-shadow:0 0 18px rgba(232,176,74,.9)}}
.body{flex:1;display:flex;flex-direction:column;gap:18px;margin-top:22px;font-size:19px;justify-content:center;padding-bottom:28px}
.foot{position:absolute;left:72px;right:44px;bottom:18px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);z-index:1}
.foot b{color:var(--blue);font-weight:600}
/* entrada en cascada */
.sl.in{animation:fade .45s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sl.in .body>*,.sl.in .st>*:not(.ans){animation:up .7s cubic-bezier(.2,.75,.2,1) both}
.sl.in .body>*:nth-child(1){animation-delay:.15s}.sl.in .body>*:nth-child(2){animation-delay:.35s}.sl.in .body>*:nth-child(3){animation-delay:.55s}.sl.in .body>*:nth-child(4){animation-delay:.75s}.sl.in .body>*:nth-child(5){animation-delay:.95s}
.sl.in .st>*:nth-child(1){animation-delay:.2s}.sl.in .st>*:nth-child(2){animation-delay:.32s}.sl.in .st>*:nth-child(3){animation-delay:.44s}.sl.in .st>*:nth-child(4){animation-delay:.56s}.sl.in .st>*:nth-child(5){animation-delay:.68s}.sl.in .st>*:nth-child(6){animation-delay:.8s}.sl.in .st>*:nth-child(7){animation-delay:.92s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* divisores */
.div{background:radial-gradient(ellipse at 75% 70%,#24408a 0,var(--navy) 55%,#0e1a3e 100%);color:#fff;justify-content:center;padding-left:96px}
.div h1{color:#fff;font-size:58px;max-width:800px}
.div p{margin:22px 0 0;font-size:22px;color:#c9d4ee;max-width:700px}
.div .num{position:absolute;right:80px;bottom:30px;font:800 200px/1 Raleway,sans-serif;color:var(--gold);text-shadow:0 0 40px rgba(232,176,74,.55);z-index:1}
.sl.in.div .num{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{text-shadow:0 0 22px rgba(232,176,74,.35)}50%{text-shadow:0 0 60px rgba(232,176,74,.85)}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd98a;box-shadow:0 0 10px 3px rgba(255,210,120,.7);z-index:0;opacity:.0;animation:twinkle var(--t,6s) ease-in-out var(--d,0s) infinite}
@keyframes twinkle{0%{opacity:0;transform:translateY(0)}30%{opacity:.9}100%{opacity:0;transform:translateY(-120px)}}
/* portada */
.cover{background:linear-gradient(90deg,#fff 0 57%,var(--navy) 57%)}
.cover h1{font-size:56px;max-width:600px;margin-top:84px}
.cover .who{margin-top:28px;font-size:19px;color:var(--mut);max-width:600px}
.cover .who b{color:var(--navy)}
.cover .side{position:absolute;right:52px;top:140px;width:440px;color:#fff}
.cover .side h3{font:700 20px/1 Raleway,sans-serif;color:var(--gold);margin:0 0 18px}
.cover .side ol{padding-left:0;margin:0;list-style:none;counter-reset:c}
.cover .side li{margin:0 0 13px;font-size:18.5px;color:#dfe6f6;display:flex;gap:12px;align-items:center}
.cover .side li::before{counter-increment:c;content:counter(c);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 14px "Open Sans";background:rgba(232,176,74,.18);color:var(--gold);box-shadow:0 0 12px rgba(232,176,74,.35);flex:none}
.cover .side li span{margin-left:auto;color:#9fb0d6;font-size:15px}
/* componentes */
.st{display:grid;gap:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;font-size:17px;line-height:1.45;box-shadow:0 6px 22px rgba(22,38,84,.06)}
.card h4{margin:0 0 6px;font:700 20px/1.2 Raleway,sans-serif;color:var(--navy);display:flex;align-items:center;gap:9px}
.card h4 i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px rgba(232,176,74,.6);flex:none}
.card.g{background:var(--goldl);border-color:#f3e2bd}
.card.s{background:var(--sky);border-color:#dbe5f6}
.card.n{background:var(--navy);border-color:var(--navy);color:#dfe6f6}.card.n h4{color:#fff}
.card .k{font:800 26px/1.15 Raleway,sans-serif;color:var(--blue);display:block;margin:2px 0 4px}
.card.n .k{color:var(--gold)}
.mut{color:var(--mut)}
.quote{font:600 25px/1.35 Raleway,sans-serif;color:var(--navy);padding:6px 0 6px 22px;border-left:4px solid var(--gold)}
.quote small{display:block;font:400 15px "Open Sans";color:var(--mut);margin-top:6px}
.formula{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:700 21px Raleway,sans-serif}
.formula span{padding:10px 18px;border-radius:12px;background:var(--sky);color:var(--navy)}
.formula span.g{background:var(--goldl)}.formula span.n{background:var(--navy);color:#fff}
.formula span.sub{background:none;color:var(--mut);font:400 15px "Open Sans",sans-serif;padding:0 8px 0 0;margin-left:-6px}
.formula em{font-style:normal;color:var(--gold);font-size:26px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:17px;line-height:1.38;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 22px rgba(22,38,84,.06);border:1px solid var(--line)}
.t th{background:var(--navy);color:#fff;text-align:left;padding:11px 14px;font-weight:600;font-size:15px}
.t td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.t td:first-child{font-weight:700;color:var(--navy)}
.flow{display:flex;gap:14px;align-items:stretch}
.flow>div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;font-size:16.5px;box-shadow:0 6px 22px rgba(22,38,84,.05)}
.flow>div:not(:last-child)::after{content:"";position:absolute;right:-13px;top:50%;width:12px;height:2px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.flow>div>b{display:block;color:var(--navy);font:700 18px Raleway,sans-serif;margin-bottom:3px}
.flow .n{display:block;font:800 13px "Open Sans";color:var(--gold);letter-spacing:.5px}
.tag{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:4px 13px;font-size:15px;font-weight:600;margin:3px 4px 3px 0}
.tag.g{background:var(--gold);color:var(--navy);box-shadow:0 0 12px rgba(232,176,74,.5)}
.tag.l{background:var(--sky);color:var(--navy)}
.trap{display:flex;gap:12px;align-items:center;font-size:17.5px;color:#7a2a22}
.trap::before{content:"!";flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fde3df;color:var(--bad);font-weight:800;box-shadow:0 0 12px rgba(178,58,58,.25)}
.hero{font:800 30px/1.2 Raleway,sans-serif;color:var(--navy);text-wrap:balance}
.hero b{color:var(--blue)}
.dotline{display:flex;justify-content:space-between;position:relative;margin-top:6px}
.dotline::before{content:"";position:absolute;left:4%;right:4%;top:11px;height:2px;background:linear-gradient(90deg,var(--gold),var(--blue))}
.dotline>div{width:19%;text-align:center;font-size:15.5px;color:var(--mut)}
.dotline>div b{display:block;font:700 18px Raleway,sans-serif;color:var(--navy);margin-bottom:4px}
.dotline>div::before{content:"";position:absolute;top:4px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 0 12px rgba(232,176,74,.7);margin-left:-8px}
.dotline>div{position:relative;padding-top:34px}
.dotline>div::before{left:50%}
/* pirámide */
.pyr{display:flex;flex-direction:column;align-items:center;gap:5px}
.pyr div{color:#fff;text-align:center;padding:12px 6px;font:700 18px Raleway,sans-serif;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%)}
.pyr div:nth-child(1){width:46%;padding-top:16px;background:var(--navy);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);box-shadow:0 0 30px rgba(232,176,74,.6)}
.pyr div:nth-child(2){width:63%;background:#24418a}.pyr div:nth-child(3){width:81%;background:var(--blue)}.pyr div:nth-child(4){width:99%;background:#4d74c2}
.pyr small{display:block;font:400 13.5px "Open Sans";color:#dbe4f7}
/* 6·6 */
.six{font:800 180px/1 Raleway,sans-serif;color:var(--navy);text-align:center;letter-spacing:-4px}
.six i{font-style:normal;color:var(--gold);text-shadow:0 0 30px rgba(232,176,74,.9);display:inline-block}
.sl.in .six i{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
/* preguntas */
.q .stem{font-size:19px;line-height:1.45;background:var(--sky);border-radius:16px;padding:14px 20px}
.opts{display:grid;gap:9px}
.opts div{border:1px solid var(--line);border-radius:12px;padding:8px 18px;font-size:18px;background:#fff;transition:.35s}
.opts div b{color:var(--blue);margin-right:10px}
.ans{opacity:0;transform:translateY(8px);transition:.45s;background:var(--okl);border-radius:14px;padding:12px 18px;font-size:18px}
.ans b{color:var(--ok)}
.rev .ans{opacity:1;transform:none}
.rev .opts .k{border-color:var(--ok);background:var(--okl);font-weight:700;box-shadow:0 0 0 3px rgba(29,122,82,.15),0 0 24px rgba(29,122,82,.35)}
.hint{font-size:13px;color:var(--mut)}
.rev .hint{display:none}
/* barra de control */
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(13,20,48,.9);color:#fff;border-radius:999px;padding:6px 8px;font-size:14px;opacity:0;transition:opacity .3s;z-index:5}
#screen:hover #bar,#bar:focus-within{opacity:1}
#bar button{background:transparent;border:0;color:#fff;font:600 14px "Open Sans";padding:8px 12px;border-radius:999px;cursor:pointer;min-height:40px}
#bar button:hover,#bar button:focus-visible{background:rgba(255,255,255,.15);outline:none}
#bar .dot{width:9px;height:9px;border-radius:50%;background:#7a8199;margin:0 6px}
#bar .dot.on{background:#3ad38a;box-shadow:0 0 8px #3ad38a}
#qr{position:absolute;inset:0;background:rgba(13,20,48,.92);display:none;place-items:center;z-index:4}
#qr.on{display:grid}
#qr .box{background:#fff;border-radius:20px;padding:28px 34px;text-align:center;width:460px;box-shadow:0 0 60px rgba(232,176,74,.35)}
#qr .box h2{font:800 24px Raleway,sans-serif;color:var(--navy);margin:0 0 6px}
#qr .box p{margin:0 0 14px;color:var(--mut);font-size:15px}
#qr .code{width:300px;height:300px;margin:0 auto}
#qr .code svg,#qr .code img,#qr .code canvas{width:100%;height:100%}
#qrurl{margin:10px 0 4px;font-size:12px;word-break:break-all;color:var(--mut)}
#drawer{position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:#fff;border-top:4px solid var(--gold);padding:14px 22px 60px;font-size:16px;display:none;z-index:3}
#drawer.on{display:block}
/* vista de notas */
#notes{display:none;position:fixed;inset:0;background:#f3f5fa;overflow:auto;padding:0 0 100px}
.nb-top{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nb-top .pos{font:800 18px Raleway,sans-serif}
.nb-top .sec{font-size:13px;color:#c9d4ee;flex:1 1 140px}
.nb-top .clock{font:700 17px "Open Sans";background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 10px;min-height:40px;cursor:pointer}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:#c9d4ee}
.sync i{width:9px;height:9px;border-radius:50%;background:#7a8199;display:inline-block}
.sync.on i{background:#3ad38a;box-shadow:0 0 8px #3ad38a}
.thumbwrap{margin:12px 14px 0;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12);background:#fff;position:relative}
.thumb{width:1280px;height:720px;transform-origin:0 0;position:relative;pointer-events:none}
.thumb *{animation:none!important}
.ncard{margin:12px 14px;background:#fff;border-radius:14px;padding:16px 16px 18px;font-size:17px;line-height:1.6;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ncard h2{font:800 20px/1.2 Raleway,sans-serif;color:var(--navy);margin:0 0 6px}
.ncard .time{display:inline-block;background:var(--goldl);color:#8a5a00;font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.ncard h3{font:700 13px "Open Sans";letter-spacing:.3px;color:var(--blue);margin:16px 0 6px}
.ncard .g p{margin:0 0 10px}
.ncard ul{padding-left:20px;margin:4px 0}.ncard li{margin:6px 0}
.ncard .p{background:var(--okl);border-radius:10px;padding:10px 12px;margin-top:12px}
.ncard .v{background:#fff4f2;border-radius:10px;padding:10px 12px;margin-top:10px}
.nextline{margin:0 14px;color:var(--mut);font-size:14px}
.nb-bot{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.nb-bot button{min-height:56px;border-radius:12px;border:0;font:700 17px "Open Sans";cursor:pointer}
.nb-bot .p{background:var(--sky);color:var(--navy)}
.nb-bot .n{background:var(--navy);color:#fff}
.nb-bot button:focus-visible{outline:3px solid var(--gold)}
body.notes{background:#f3f5fa;overflow:auto}
body.notes #screen{display:none}
body.notes #notes{display:block}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- versión de estudio ---- */
html,body{height:auto}
body{background:#f3f5fa;overflow:auto;overflow-x:hidden}
.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.top img{height:34px}
.top .ttl{font:700 16px/1.2 Raleway,sans-serif;flex:1}
.top .ttl small{display:block;font:400 12.5px "Open Sans",sans-serif;color:#c9d4ee}
.top button{background:rgba(255,255,255,.12);border:0;color:#fff;font:600 14px "Open Sans",sans-serif;border-radius:10px;padding:10px 14px;min-height:42px;cursor:pointer}
.top button:hover,.top button:focus-visible{background:rgba(255,255,255,.22);outline:none}
.prog{height:4px;background:rgba(255,255,255,.12)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffe1a3);box-shadow:0 0 10px var(--gold);transition:width .4s}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 110px}
.stagebox{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(22,38,84,.18);background:#fff}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:none}
.exp{margin-top:18px;background:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 2px 10px rgba(22,38,84,.06);font-size:17px;line-height:1.65}
.exp h2{font:800 24px/1.2 Raleway,sans-serif;color:var(--navy);margin:0 0 4px}
.exp .bl{color:var(--blue);font-size:13.5px;font-weight:600;margin-bottom:12px}
.exp h3{font:700 14px "Open Sans",sans-serif;color:var(--blue);margin:20px 0 6px;display:flex;align-items:center;gap:8px}
.exp h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.exp .g p{margin:0 0 12px}
.exp ul{padding-left:22px;margin:4px 0}.exp li{margin:6px 0}
.exp .box{border-radius:12px;padding:12px 16px;margin-top:14px}
.exp .q{background:var(--okl)}.exp .q b{color:var(--ok)}
.exp .v{background:#fff4f2}.exp .v b{color:var(--bad)}
.exp .more{background:var(--sky)}
.revbtn{display:inline-flex;align-items:center;gap:8px;margin-top:6px;background:var(--ok);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:700 16px "Open Sans",sans-serif;cursor:pointer;min-height:46px;box-shadow:0 0 18px rgba(29,122,82,.35)}
.revbtn:focus-visible{outline:3px solid var(--gold)}
.keybox{display:none}.keybox.on{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(22,38,84,.06)}
.nav-in{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav button{min-height:52px;border-radius:12px;border:0;font:700 16px "Open Sans",sans-serif;cursor:pointer}
.nav .p{background:var(--sky);color:var(--navy)}.nav .n{background:var(--navy);color:#fff}
.nav button:disabled{opacity:.4;cursor:default}
.nav button:focus-visible{outline:3px solid var(--gold)}
.nav .pos{font:700 15px "Open Sans",sans-serif;color:var(--mut);text-align:center;min-width:70px}
.hintk{font-size:12.5px;color:var(--mut);text-align:center;margin-top:10px}
#idx{position:fixed;inset:0;z-index:20;background:rgba(13,20,48,.55);display:none}
#idx.on{display:block}
#idx .pane{position:absolute;right:0;top:0;bottom:0;width:min(420px,92vw);background:#fff;overflow:auto;padding:18px 18px 40px;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
#idx h4{font:700 13px "Open Sans",sans-serif;color:var(--blue);margin:16px 0 6px}
#idx a{display:block;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px}

n:{tm:"min 0 – 5",g:`<p>Buenas noches a todos. Gracias por conectarse. Mañana, jueves 19, de 7 a 9 de la mañana en la sala digital, es el examen final de Programas de Educación con la profesora Yadira, y el plan calendario dice que entran todos los temas del semestre.</p>
<p>La idea de hoy no es leer diapositivas: en pantalla van a ver solo las palabras clave; yo les voy a ir contando lo que hay detrás. Vamos en siete bloques, en el mismo orden en que vimos la materia: primero los fundamentos y las teorías; luego el sistema educativo y las leyes; después el proceso de enseñanza-aprendizaje y los métodos; currículo, competencias y RAE; el bloque más largo, que es didáctica y técnicas; evaluación y prueba objetiva; y cerramos con ocho preguntas tipo examen.</p>
<p>Tengan papel a mano: en el último bloque cada uno responde antes de que yo muestre la clave. Y si algo no queda claro, pregunten en el momento.</p>`,
x:["Tiempo total: 120 minutos. Si a los 60 minutos no has llegado al bloque 5, reduce el bloque 4 a 5 minutos (solo fórmulas de competencia y RAE).","Las preguntas del examen suelen ser tipo ICFES: selección múltiple con única respuesta y análisis de relación (afirmación PORQUE razón)."],
p:"Si alguien pregunta qué estudiar primero esta noche: los 5 criterios de clasificación de métodos, las técnicas didácticas y la construcción de ítems. Son los temas con más casos."}},

{s:1,k:"div",t:"Fundamentos y teorías del aprendizaje",h:`<p>De dónde viene la educación y cómo explicamos que alguien aprende.</p><div class="num">1</div>`,
n:{tm:"min 5",g:`<p>Empezamos por la base. Este bloque responde a dos preguntas: qué es educar y cómo explican las distintas teorías que una persona aprende. En el examen esto aparece como "¿qué autor dijo…?" o "¿a qué teoría corresponde esta práctica?".</p>`,x:["Bloque de 15 minutos: 3 diapositivas."]}},

{s:1,t:"Educación, pedagogía y su historia",
h:`<div class="st c2">${C(`<h4><i></i>Educación</h4><span class="k">el proceso</span><span class="mut">transmitir y adquirir saberes, habilidades, valores y actitudes</span>`,'s')}${C(`<h4><i></i>Pedagogía</h4><span class="k">la ciencia</span><span class="mut">estudia fundamentos, objetivos, métodos y evaluación de la educación</span>`,'g')}</div>
<div class="dotline"><div><b>Renacimiento</b>práctica y espíritu</div><div><b>Comenio</b>"enseñar todo a todos"</div><div><b>Ilustración</b>razón y Estado</div><div><b>Colonia</b>religiosa y memorística</div><div><b>Hoy</b>Pestalozzi, Montessori, Escuela Nueva</div></div>`,
n:{tm:"min 5 – 8",g:`<p>Dos palabras que se confunden mucho. La <b>educación</b> es el proceso: alguien transmite y alguien adquiere conocimientos, habilidades, valores y actitudes, por la interacción entre un educador y un educando, y puede pasar en la escuela, en la familia, en la comunidad o en el trabajo. La <b>pedagogía</b> es la ciencia que estudia ese proceso: sus fundamentos, sus objetivos, sus métodos y su evaluación. Educación es lo que pasa; pedagogía es quien lo estudia.</p>
<p>En la línea de tiempo: en el Renacimiento se enseñaban habilidades prácticas y espirituales. Comenio propone una escuela para todos sin distinción, "enseñar todo a todos". La Ilustración pone la razón en el centro, la educación pasa a cargo del Estado y se cambia el latín por oficios, ciencias, matemáticas y geografía. En la Colonia, en América, la educación fue un monopolio religioso, elitista y clasista, con metodología memorística, y servía como control ideológico; al final de la Colonia la Ilustración empieza a cambiar ese modelo.</p>
<p>Ya en la edad contemporánea: Pestalozzi plantea enseñar con afecto, incentivar la curiosidad y eliminar la violencia; Montessori, que el niño aprenda de forma autónoma, a su ritmo, guiado por su curiosidad; y la Escuela Nueva dice "solo se conoce bien lo que se hace", o sea, une la educación con la experiencia real.</p>`,
x:["La educación en la Colonia se describe como un mecanismo de control geopolítico, contrarreforma religiosa y contención ideológica.","La Ilustración aporta la Enciclopedia y una nueva mirada al papel del niño.","Comenio también es el 'padre de la didáctica' (lo retomamos en el bloque 5)."],
p:"Pregunta típica: '¿qué movimiento afirma que solo se conoce bien lo que se hace?' → Escuela Nueva.",
v:"La diapositiva de clase ubica a Comenio en el 'siglo XVIII', pero vivió de 1592 a 1670 (siglo XVII) y publicó la Didáctica Magna en 1640."}},

{s:1,t:"Las teorías en una mirada",
h:`<table class="t"><tr><th>Teoría</th><th>Idea clave</th><th>El docente…</th><th>Autores</th></tr>
<tr><td>Tradicional</td><td>Memoria y transmisión</td><td>es dueño de la verdad</td><td>—</td></tr>
<tr><td>Conductismo</td><td>Estímulo → respuesta</td><td>entrena y refuerza</td><td>Pavlov · Skinner</td></tr>
<tr><td>Cognitivismo</td><td>Procesar información</td><td>fomenta la comprensión</td><td>Piaget · Ausubel · Vygotsky</td></tr>
<tr><td>Constructivismo</td><td>Construir el saber</td><td>facilita y media</td><td>Ausubel · ABP · experiencial</td></tr>
<tr><td>Humanismo</td><td>Autorrealización</td><td>centra todo en el alumno</td><td>Rogers · Maslow</td></tr>
<tr><td>Crítica</td><td>Transformar la realidad</td><td>despierta conciencia crítica</td><td>Freire · Giroux · Illich</td></tr></table>`,
n:{tm:"min 8 – 13",g:`<p>Esta tabla es probablemente la más preguntada del primer corte. Léanla por filas.</p>
<p>La <b>tradicional</b>: el docente es el poseedor de la verdad total, la transmisión es enciclopedista, hay paternalismo, el alumno es pasivo y prima la memoria.</p>
<p>El <b>conductismo</b> trabaja con estímulo y respuesta. Tiene dos formas: el condicionamiento <b>clásico</b> de Pavlov, el del perro que saliva con la campana, que es asociar una respuesta a un estímulo; y el condicionamiento <b>operante</b> de Skinner, la caja con la paloma, donde la conducta se moldea con recompensas o castigos. Su modelo de enseñanza es entrenar habilidades.</p>
<p>El <b>cognitivismo</b> no es una sola teoría sino un marco: le interesa cómo la mente procesa la información (percepción, atención, memoria, lenguaje). Ahí están Piaget, con el desarrollo por etapas y los procesos de asimilación y acomodación; Ausubel, con el aprendizaje significativo; y Vygotsky, que pone la interacción social y el entorno sociocultural como motor del desarrollo.</p>
<p>El <b>constructivismo</b> dice que el estudiante construye su conocimiento de forma activa: aquí entran el aprendizaje experiencial, el aprendizaje basado en problemas y el significativo de Ausubel, donde lo nuevo se ancla a lo que ya sé.</p>
<p>El <b>humanismo</b> está centrado en el alumno: Rogers propone que el estudiante sea autónomo y responsable de su aprendizaje, y Maslow, con su pirámide, dice que las necesidades se satisfacen de forma progresiva hasta llegar a la autorrealización.</p>
<p>Y la <b>crítica</b> ve la educación como herramienta de cambio: Freire con la educación liberadora, Giroux denunciando que el sistema tradicional reproduce desigualdades, e Illich proponiendo la desescolarización, aprender fuera de la institución.</p>`,
x:["Piaget, etapas: sensoriomotora, preoperacional, operaciones concretas y operaciones formales.","Vygotsky: zona de desarrollo próximo, la distancia entre lo que el estudiante hace solo y lo que logra con ayuda de alguien más capaz.","Ausubel llama 'subsunsores' a los conceptos previos donde se ancla lo nuevo.","Freire critica la 'educación bancaria', donde el docente 'deposita' contenidos en el alumno.","Maslow, de la base a la cima: fisiológicas, seguridad, afiliación, reconocimiento y autorrealización.","La profe también nombró el aprendizaje social (Bandura: aprender observando un modelo) y el aprendizaje por descubrimiento (Bruner)."],
p:"'Lo nuevo se relaciona con conocimientos previos' → Ausubel. 'Recompensa y castigo' → Skinner (operante). 'Educación como herramienta de cambio social' → teoría crítica (Freire)."}},

{s:1,t:"Cómo aprendemos: leyes, fases y factores",
h:`<div class="st c4">${C(`<span class="k">Preparación</span><span class="mut">estar listo da satisfacción</span>`)}${C(`<span class="k">Ejercicio</span><span class="mut">la práctica refuerza</span>`)}${C(`<span class="k">Efecto</span><span class="mut">se fija lo que satisface</span>`)}${C(`<span class="k">Primacía e intensidad</span><span class="mut">lo primero y lo fuerte perduran</span>`)}</div>
<div class="formula"><span>Sincrética</span><em>→</em><span class="g">Analítica</span><em>→</em><span class="n">Sintética</span></div>
<div class="st c2">${C(`<h4><i></i>Modos</h4>motor · intelectual · emotivo<br><span class="mut">estilos: visual, auditivo, lectoescritor, kinestésico</span>`,'s')}${C(`<h4><i></i>Factores</h4><b>internos</b>: motivación, edad mental, saberes previos<br><b>externos</b>: contexto, docente, recursos`,'g')}</div>`,
n:{tm:"min 13 – 20",g:`<p>Las <b>leyes clásicas del aprendizaje</b>. La de la <b>preparación</b>: cuando la persona está dispuesta, hacer aquello para lo que está lista le satisface; por eso el docente debe considerar la edad o nivel mental, los conocimientos previos y la motivación. La del <b>ejercicio</b>: las conexiones se refuerzan con la práctica repetida, como cuando practicamos una y otra vez el lavado de manos. La del <b>efecto</b>: se fijan mejor las respuestas que van seguidas de satisfacción. Y la de <b>primacía e intensidad</b>: lo que se aprende primero y lo que se vive con más intensidad deja la huella más duradera.</p>
<p>Las <b>fases</b> van en orden: primero la <b>sincrética</b>, una visión global y todavía confusa del tema; luego la <b>analítica</b>, separo el tema en partes; y al final la <b>sintética</b>, vuelvo a integrar todo en un conjunto con sentido.</p>
<p>Los <b>modos de aprender</b> son motor, intelectual y emotivo, y en el plan calendario también aparecen los estilos visual, auditivo, de lectoescritura y kinestésico. Y los <b>factores</b>: internos, los que dependen de la persona (motivación, edad mental, conocimientos previos), y externos, los del entorno (contexto, docente, recursos).</p>`,
x:["Truco: fases S-A-S (Sincrética, Analítica, Sintética).","No confundir estas fases con los métodos analítico y sintético del bloque 3: las fases describen cómo progresa quien aprende; los métodos clasifican cómo enseña el docente.","Ejemplo de factor externo en salud: un servicio con ruido e interrupciones que impide la sesión educativa al paciente."],
p:"Caso: 'un estudiante cansado y desmotivado no logra aprender la técnica' → ley de la preparación y factor interno."}},

{s:2,k:"div",t:"Sistema educativo y normatividad",h:`<p>Qué ley regula qué, y qué normas tocan a la formación en salud.</p><div class="num">2</div>`,
n:{tm:"min 20",g:`<p>Segundo bloque: las leyes. No hay que memorizar artículos sueltos; lo que más preguntan es qué ley regula qué nivel y cómo se clasifica la educación. Si se aprenden el truco de la siguiente diapositiva, ya tienen la mitad.</p>`,x:["Bloque de 15 minutos: 3 diapositivas."]}},

{s:2,t:"Ley 115 de 1994: tres tipos de educación",
h:`<div class="st c3">${C(`<h4><i></i>Formal</h4><span class="k">título</span><span class="mut">niveles, grados y ciclos regulares</span>`,'s')}${C(`<h4><i></i>No formal · ETDH</h4><span class="k">certificado</span><span class="mut">estructurada, sin niveles ni grados</span>`,'g')}${C(`<h4><i></i>Informal</h4><span class="k">nada</span><span class="mut">libre, espontánea, sin estructura</span>`)}</div>
<div class="quote">Constitución, art. 67: la educación es un derecho de la persona y un servicio público con función social.</div>
<div class="trap">La Ley 115 no regula la educación superior: eso lo hace la Ley 30 de 1992.</div>`,
n:{tm:"min 20 – 25",g:`<p>El punto de partida es el artículo 67 de la Constitución: la educación es un derecho de la persona y un servicio público con función social, que busca el acceso al conocimiento, la ciencia y la tecnología, y la formación integral. Ese artículo se desarrolla con la <b>Ley 115 de 1994</b>, la Ley General de Educación, expedida el 8 de febrero de 1994, con 222 artículos organizados en 11 títulos.</p>
<p>La ley clasifica la educación en tres tipos, y el truco es este: <b>formal = título, no formal = certificado, informal = nada</b>. La formal se imparte en establecimientos aprobados, en ciclos lectivos regulares, con pautas curriculares progresivas, y conduce a grados y títulos, como el colegio que da el título de bachiller. La no formal busca complementar, actualizar o formar en aspectos académicos o laborales sin sujeción a niveles y grados, y entrega un certificado de aptitud ocupacional; la Ley 1064 de 2006 le cambió el nombre a Educación para el Trabajo y el Desarrollo Humano, ETDH. Ejemplo: un curso de auxiliar de enfermería. Y la informal es todo conocimiento libre y espontáneo que viene de personas, medios de comunicación, tradiciones o costumbres, sin estructura, sin título y sin certificado.</p>
<p>Ojo con la trampa clásica: la Ley 115 regula preescolar, básica, media, la no formal y la informal; la educación superior la regula la Ley 30 de 1992.</p>`,
x:["Lo 'no formal' sí está estructurado (tiene instructor, duración, metodología); lo que no tiene son niveles y grados. Esa es la diferencia con lo informal.","Art. 44 de la Constitución: derechos de los niños. Art. 68: libertad de enseñanza y autonomía universitaria.","Art. 5 de la Ley 115: 13 fines de la educación. Art. 6: comunidad educativa (estudiantes, educadores, padres, egresados, directivos y administradores). Art. 23: 9 áreas obligatorias.","El Decreto 4904 de 2009 reglamenta la oferta de la ETDH (aparece en la bibliografía del curso)."],
p:"V/F: 'la educación informal hace parte del sistema educativo' → Verdadero (art. 2). 'La educación para el trabajo hace parte de la formal' → Falso."}},

{s:2,t:"Niveles: de preescolar al doctorado",
h:`<div class="flow"><div><span class="n">LEY 115</span><b>Preescolar</b>mínimo 1 grado</div><div><span class="n">LEY 115</span><b>Básica</b>9 grados: 5 + 4</div><div><span class="n">LEY 115</span><b>Media</b>10.° y 11.° · bachiller</div><div style="border-color:var(--gold);box-shadow:0 0 18px rgba(232,176,74,.35)"><span class="n">LEY 30</span><b>Superior</b>pregrado y posgrado</div></div>
<div class="formula"><span>Técnico profesional</span><em>→</em><span class="g">Tecnólogo</span><em>→</em><span class="n">Profesional</span></div>
<div class="st c4">${C(`<h4><i></i>Especialización</h4>después del pregrado`,'s')}${C(`<h4><i></i>Maestría</h4>trabajo de investigación`,'s')}${C(`<h4><i></i>Doctorado</h4>forma investigadores, tesis`,'s')}${C(`<h4><i></i>Posdoctorado</h4>nivel más avanzado`,'s')}</div>`,
n:{tm:"min 25 – 28",g:`<p>La educación formal tiene tres niveles según la Ley 115. <b>Preescolar</b>, con mínimo un grado obligatorio, para niños menores de 6 años. <b>Básica</b>, que es obligatoria y tiene 9 grados en dos ciclos: primaria de 5 grados y secundaria de 4. Y <b>media</b>, con dos grados, décimo y once, académica o técnica, que termina en el título de bachiller y habilita para la educación superior.</p>
<p>La <b>educación superior</b> la organiza la Ley 30 de 1992, en pregrado y posgrado. En el pregrado están los <b>ciclos propedéuticos</b>, desarrollados por la Ley 749 de 2002: son etapas flexibles y secuenciales. El estudiante puede empezar como técnico profesional, en 2 o 3 años; seguir a tecnólogo, en unos 3; y llegar a profesional universitario, en unos 5, sin que sean compartimentos cerrados.</p>
<p>Y el posgrado, según el artículo 10 de la Ley 30: especialización, que se hace después del pregrado; maestría, que culmina con un trabajo de investigación; doctorado, que forma investigadores y termina en tesis; y posdoctorado, el nivel más avanzado.</p>`,
x:["Ley 30, art. 16: tipos de institución: técnicas profesionales, instituciones universitarias o escuelas tecnológicas, y universidades.","Técnico profesional: ocupaciones operativas e instrumentales (saber hacer). Tecnólogo: fundamentación científica + aplicación tecnológica. Profesional: mayor profundidad teórica, disciplinar e investigativa.","Ley 749: las instituciones técnicas y tecnológicas solo pueden ofrecer programas profesionales mediante ciclos propedéuticos.","Autonomía universitaria: art. 69 de la Constitución y art. 28 de la Ley 30."],
p:"'¿Qué ley desarrolla los ciclos propedéuticos?' → Ley 749 de 2002."}},

{s:2,t:"Formación en salud y en enfermería",
h:`<div class="st c2">${C(`<h4><i></i>Decreto 376 de 2022</h4><span class="k">formación continua</span><span class="mut">del talento humano en salud, para mejorar la calidad de la atención</span>`,'s')}${C(`<h4><i></i>Ley 911 de 2004 · cap. IV</h4><span class="k">R · I · D · P</span><span class="mut">arts. 31 a 34: enfermería en docencia e investigación</span>`,'g')}</div>
<div class="st c4">${C(`<b>31</b> · Riesgos`)}${C(`<b>32</b> · Integral`)}${C(`<b>33</b> · Dignidad`)}${C(`<b>34</b> · Propiedad intelectual`)}</div>
<div class="card s"><b>ACOFAEN</b> da los lineamientos comunes; cada programa se distingue por su modelo pedagógico, su teoría de enfermería, su enfoque territorial y su investigación.</div>`,
n:{tm:"min 28 – 35",g:`<p>El <b>Decreto 376 de 2022</b> fija los lineamientos del Sistema de Formación Continua para el Talento Humano en Salud, y desarrolla el artículo 98 de la Ley 1438 de 2011. Su objetivo es optimizar el desempeño del talento humano en salud y su desarrollo personal y ocupacional, para que el usuario reciba mejores servicios. Está dirigido a tres grupos: las entidades reguladoras (el Ministerio de Salud y los entes territoriales), los oferentes (IES, instituciones de ETDH, SENA, IPS, EPS, sociedades científicas) y el propio talento humano: técnicos, tecnólogos, profesionales y especialistas. La palabra clave es <b>continua</b>.</p>
<p>La <b>Ley 911 de 2004</b>, en su capítulo IV, habla de la responsabilidad del profesional de enfermería en la docencia y la investigación. Truco: <b>R-I-D-P</b>. Artículo 31, <b>riesgos</b>: en docencia hay que tomar medidas para evitar los errores que los estudiantes pueden cometer por falta de pericia. Artículo 32, formación <b>integral</b>: formar a la persona, al ciudadano y al profesional, estimulando el pensamiento crítico, la creatividad y la investigación. Artículo 33, <b>dignidad</b>: respetar al estudiante y su derecho a una enseñanza acorde con su nivel y basada en conocimiento actualizado. Artículo 34, <b>propiedad</b> intelectual de estudiantes y colegas.</p>
<p><b>ACOFAEN</b>, la Asociación Colombiana de Facultades de Enfermería, da los lineamientos comunes, pero cada programa se distingue por su modelo pedagógico, la teoría de enfermería que usa como eje (Orem, Watson, Roy), su enfoque territorial, su articulación con la atención primaria y su nivel de investigación e internacionalización.</p>`,
x:["El Decreto 376 obliga a EPS, IPS y entes territoriales a tener un Plan Institucional de Formación Continua con seguimiento medible.","Crítica que puedes dar si piden opinión: no fija una fuente de financiación ni sanciones claras; en IPS pequeñas o rurales la formación depende más de la iniciativa personal.","Ley 1164 de 2007: disposiciones sobre el talento humano en salud (aparece en la bibliografía)."],
p:"'Un estudiante comete un error en práctica por falta de pericia; ¿qué artículo de la Ley 911 obliga al docente a prevenirlo?' → Art. 31."}},

{s:3,k:"div",t:"Proceso de enseñanza-aprendizaje",h:`<p>El camino, la herramienta y los cinco ángulos para clasificar cualquier método.</p><div class="num">3</div>`,
n:{tm:"min 35",g:`<p>Tercer bloque. Aquí está uno de los temas más preguntados como caso: la profe describe lo que hace un docente y ustedes tienen que clasificar el método.</p>`,x:["Bloque de 15 minutos: 3 diapositivas."]}},

{s:3,t:"Método y técnica",
h:`<div class="quote">El método indica el camino; la técnica indica cómo recorrerlo.<small>Nérici, Hacia una didáctica general dinámica</small></div>
<div class="flow"><div><b>Metodología</b>el conjunto</div><div><b>Método</b><i>meta + hodos</i> · camino hacia una meta</div><div><b>Técnica</b><i>technicus</i> · cómo hacer algo</div></div>
<div class="hero">Una técnica, con suficiente amplitud, <b>se vuelve método</b>: el seminario.</div>`,
n:{tm:"min 35 – 38",g:`<p>La palabra <b>método</b> viene del griego <i>meta</i> y <i>hodos</i>: camino hacia una meta. Es el conjunto de momentos y técnicas coordinados lógicamente para dirigir el aprendizaje hacia un objetivo, y le da unidad a todo el proceso. La <b>técnica</b> viene de <i>technicus</i>, cómo hacer algo: es el recurso concreto para realizar un momento específico del método. Por eso Nérici dice que el método indica el camino y la técnica cómo recorrerlo.</p>
<p>Arriba de los dos está la <b>metodología</b>, que es el conjunto de métodos y técnicas orientados a un fin educativo. Jerarquía: metodología, método, técnica.</p>
<p>Y un dato fino que suelen preguntar: una técnica, si se aplica con suficiente amplitud, puede convertirse en método. El ejemplo clásico es el seminario.</p>`,
x:["Técnicas didácticas (definición de la profe): formas, medios o procedimientos sistematizados y suficientemente probados que ayudan a desarrollar y organizar una actividad según sus finalidades.","Ejemplos de técnicas: expositiva (la más usada, debe ser breve), interrogatorio, estudio de caso, debate, seminario, demostración."],
p:"Si dan una lista y preguntan cuál es técnica y cuál método: el método da la ruta completa (ej. inductivo); la técnica es la herramienta puntual (ej. lluvia de ideas)."}},

{s:3,t:"Cinco preguntas para clasificar un método",
h:`<table class="t"><tr><th>Pregunta</th><th>Sí…</th><th>…o</th></tr>
<tr><td>¿Quién protagoniza?</td><td>Activo · el estudiante</td><td>Pasivo · el docente</td></tr>
<tr><td>¿Cómo llega al saber?</td><td>Heurístico · descubre</td><td>Dogmático · recibe la verdad</td></tr>
<tr><td>¿Dónde empieza el razonamiento?</td><td>Inductivo · de lo particular</td><td>Deductivo · de lo general</td></tr>
<tr><td>¿Cómo se presenta?</td><td>Intuitivo · experiencia directa</td><td>Simbólico · palabras y esquemas</td></tr>
<tr><td>¿Cómo se analiza?</td><td>Sintético · integra</td><td>Analítico · separa</td></tr></table>
<div class="trap">Inductivo/deductivo pregunta dónde empieza; analítico/sintético, cómo se descompone. Son ejes independientes.</div>`,
n:{tm:"min 38 – 46",g:`<p>A cualquier método le podemos hacer cinco preguntas. Truco: <b>quién, cómo llega, dónde empieza, cómo se representa, cómo se analiza</b>.</p>
<p><b>Protagonismo</b>: en el método <b>activo</b> el estudiante construye, participa y resuelve, y el profesor es guía, como en el ABP; en el <b>pasivo</b> el docente transmite y el estudiante escucha u observa, como en la clase magistral sin participación.</p>
<p><b>Construcción del conocimiento</b>: en el <b>heurístico</b> el estudiante descubre mediante preguntas, problemas o experiencias guiadas; comprende antes de aprender. Ejemplo: entender la fisiología de la bomba cardíaca antes del algoritmo de ACLS. En el <b>dogmático</b> el docente presenta el conocimiento como una verdad ya elaborada; se aprende antes de comprender, como explicar el algoritmo tal cual lo dicen las guías.</p>
<p><b>Razonamiento</b>: el <b>inductivo</b> va de lo particular a lo general. Ejemplo: presento tres pacientes con fiebre alta, dolor articular y erupción, y el grupo construye la definición de dengue. El <b>deductivo</b> va de lo general a lo particular: explico primero la fisiopatología del dengue y luego aplicamos a los casos.</p>
<p><b>Presentación</b>: el <b>intuitivo</b> parte de la observación y la experiencia directa, como practicar la venopunción en un brazo simulador; el <b>simbólico</b> usa palabras, textos, esquemas o símbolos, como leer los pasos en el manual.</p>
<p><b>Organización del pensamiento</b>: el <b>sintético</b> integra las partes en una visión global, como juntar signos vitales sueltos en un cuadro completo del paciente; el <b>analítico</b> separa las partes para comprender el todo, como estudiar corazón, venas y arterias por separado.</p>`,
x:["Lo dogmático no es 'malo': para protocolos, dosis exactas y algoritmos de reanimación es lo seguro. Para razonamiento clínico complejo se necesita también lo heurístico.","El heurístico tiene raíz en el método socrático: ironía (mostrar que no sabes lo que crees saber) + mayéutica (ayudar a 'dar a luz' el conocimiento con preguntas).","Intuitivo: Comenio ('abrir el libro del mundo') y Pestalozzi (valor de la impresión sensorial).","Existe el método analógico o comparativo: de lo particular a lo particular, por semejanza.","Ejemplo de alfabetización: analítico va de la frase a la letra; sintético, de la letra a la frase.","Un método puede ser a la vez deductivo y analítico: explico la teoría general del sistema cardiovascular y luego estudio cada parte por separado."],
p:"La trampa del examen es mezclar el criterio 3 con el 5. Pregunta siempre: ¿me preguntan dónde empieza (particular/general) o cómo se organiza (separar/integrar)?"}},

{s:3,t:"Qué enseñar y en qué orden",
h:`<div class="st c3">${C(`<h4><i></i>Conceptual</h4><span class="k">saber</span>fisiopatología`,'s')}${C(`<h4><i></i>Procedimental</h4><span class="k">saber hacer</span>punción venosa`,'s')}${C(`<h4><i></i>Actitudinal</h4><span class="k">saber ser</span>consentimiento informado`,'s')}</div>
<div class="formula"><span>Pertinencia</span><span>Actualidad</span><span>Coherencia</span><em>·</em><span class="g">N1 OMS</span><span class="g">N2 Guías</span><span class="g">N3 Libros</span><span class="g">N4 PubMed</span></div>
<div class="hero">Simple → complejo · general → específico · teoría → práctica</div>`,
n:{tm:"min 46 – 50",g:`<p>Antes de enseñar hay que decidir qué. Los contenidos son de tres tipos: <b>conceptuales</b>, el saber, como la fisiopatología de la diabetes; <b>procedimentales</b>, el saber hacer, como la técnica de punción venosa; y <b>actitudinales</b>, el saber ser, como el respeto en el consentimiento informado.</p>
<p>Para seleccionarlos hay tres criterios: <b>pertinencia</b>, ¿es útil para mi población?; <b>actualidad</b>, ¿está basado en evidencia reciente?; y <b>coherencia</b>, ¿responde al resultado de aprendizaje de la asignatura?</p>
<p>Las fuentes se jerarquizan en cuatro niveles: N1 orientadoras (OMS, OPS, Ministerio, CDC); N2 guías y consensos (GINA, AHA, KDIGO); N3 libros y recursos académicos (Brunner, Guyton, ClinicalKey); y N4 literatura científica primaria (PubMed, Scopus, Cochrane). Hacia N4 aumenta la especificidad clínica.</p>
<p>Y para secuenciar la clase: de lo simple a lo complejo, de lo general a lo específico, de la teoría a la práctica, y priorizando contenidos. En una frase: enseñar bien empieza por elegir bien.</p>`,
x:["En el plan calendario este tema se llama 'Selección y organización de contenidos' e incluye búsqueda en bases de datos y referenciación."],
p:"'¿Qué criterio falla si enseño una guía de 2010 ya reemplazada?' → actualidad."}},

{s:4,k:"div",t:"Currículo y planificación educativa",h:`<p>Del proyecto de la institución a la clase de mañana.</p><div class="num">4</div>`,
n:{tm:"min 50",g:`<p>Cuarto bloque, corto. Si vamos tarde, nos quedamos con dos cosas: los tipos de currículo y las fórmulas de competencia y RAE.</p>`,x:["Bloque de 12 minutos: 2 diapositivas."]}},

{s:4,t:"Del PEI a la asignatura",
h:`<div class="formula"><span class="n">PEI</span><em>→</em><span>Currículo</span><em>→</em><span class="g">Asignatura</span><em>→</em><span>Syllabus + plan calendario</span></div>
<div class="st c3">${C(`<h4><i></i>Formal</h4>lo escrito`,'s')}${C(`<h4><i></i>Real</h4>lo que pasa en el aula`,'s')}${C(`<h4><i></i>Oculto</h4>lo que se enseña sin escribirlo`,'g')}</div>
<div class="st c2">${C(`<h4><i></i>Componentes del PEI</h4>diagnóstico · identidad · propuesta pedagógica · propuesta de gestión`)}${C(`<h4><i></i>Elementos curriculares</h4>objetivos · contenidos · metodología · evaluación`)}</div>`,
n:{tm:"min 50 – 55",g:`<p>¿Cómo nace una asignatura? Todo empieza en el <b>PEI</b>, el Proyecto Educativo Institucional, que el Ministerio define como una "carta de navegación" donde se especifican los principios y fines de la institución, sus recursos docentes y didácticos, la estrategia pedagógica, el reglamento y el sistema de gestión. Tiene cuatro componentes: diagnóstico, identidad, propuesta pedagógica y propuesta de gestión, y eso conduce al <b>registro calificado</b> del programa. El componente de identidad es misión (razón de ser), visión (futuro deseado) y valores institucionales.</p>
<p>Del PEI sale el <b>currículo</b>: el conjunto de criterios, planes de estudio, programas, metodologías y procesos que contribuyen a la formación integral y a la identidad cultural, para poner en práctica el PEI. Hay tres tipos: el <b>formal</b>, el documento oficial con objetivos, contenidos y criterios de evaluación; el <b>real</b>, cómo se aplica de verdad en el aula, adaptado al contexto; y el <b>oculto</b>, los valores, normas y conductas que se transmiten de forma implícita, sin estar escritos.</p>
<p>Los elementos curriculares son cuatro: objetivos, contenidos, metodología y evaluación. Y la <b>asignatura</b>, cada materia del plan de estudios, se concreta en dos documentos: el syllabus, con contenidos, metodología y evaluación, y el plan calendario, que es el cronograma.</p>`,
x:["Ejemplo de currículo oculto: la puntualidad o el trato humanizado que el estudiante aprende al ver a sus docentes, aunque no esté en el syllabus.","Funciones sustantivas de la universidad: docencia, investigación y proyección social.","Ley 115: PEI (art. 73), currículo (art. 76), autonomía escolar (art. 77), plan de estudios (art. 79)."],
p:"'Lo que el estudiante aprende al observar cómo el docente trata a los pacientes' → currículo oculto."}},

{s:4,t:"Competencia y RAE",
h:`<div class="formula"><span class="n">Competencia</span><em>=</em><span>proceso de pensamiento</span><em>+</em><span>conocimiento</span><em>+</em><span class="g">contexto</span></div>
<div class="formula"><span class="n">RAE</span><em>=</em><span>acción</span><em>+</em><span>contenido</span><em>+</em><span class="g">contexto</span></div>
<div class="card s" style="font-size:18px"><b>Analizar</b> los principios de valoración del paciente crítico <span class="mut">para decidir con seguridad en unidades de alta complejidad</span><br><b>Realiza</b> una evaluación clínica completa <span class="mut">del paciente hospitalizado en la UCI</span></div>
<div class="hero">Competencia: <b>un saber hacer en contexto</b>.</div>`,
n:{tm:"min 55 – 62",g:`<p>Dos fórmulas que hay que saberse. La <b>competencia</b> se redacta con un proceso de pensamiento, un conocimiento y un contexto. Debe incluir una capacidad que integre conocimientos, habilidades, destrezas y actitudes; un área de conocimiento; y el ámbito donde se aplicará. Ejemplo: "<b>Analizar</b> los principios de valoración y manejo integral del paciente crítico, para la toma de decisiones fundamentadas en la seguridad del paciente y la calidad del cuidado en unidades de alta complejidad". Se clasifican en <b>genéricas</b>, que son transversales y comunes a varias disciplinas, y <b>específicas</b>, propias de la disciplina.</p>
<p>El <b>RAE</b>, resultado de aprendizaje esperado, describe lo que el estudiante será capaz de hacer al terminar el proceso, y debe ser coherente con la competencia. Su fórmula es acción, contenido y contexto: "<b>Realiza</b> una evaluación clínica completa del paciente hospitalizado en la UCI".</p>
<p>La diferencia: la competencia es amplia y se desarrolla a lo largo de la formación; el RAE es concreto, observable y verificable al final de la asignatura. El ICFES define la competencia como "un saber hacer en contexto".</p>`,
x:["Truco: busca primero el verbo. En la competencia es un proceso de pensamiento (analizar); en el RAE, una acción observable (realiza, identifica, ejecuta).","Otras definiciones de competencia del manual ICFES: Tobón (articula el saber ser, saber conocer y saber hacer), Vasco (desempeño en tareas nuevas, distintas a las rutinarias), Bunk (competencia profesional).","Clasificación del plan calendario: técnicas, no técnicas y ciudadanas.","Ejemplo para pedir al grupo: RAE de higiene de manos → 'Ejecuta la higiene de manos en sus 5 momentos durante la atención del paciente hospitalizado'."],
p:"Si dan un enunciado muy concreto y medible al final de la materia, es RAE; si es amplio y transversal, es competencia."}},

{s:5,k:"div",t:"Didáctica y técnicas didácticas",h:`<p>El acto de enseñar y las cuatro familias de técnicas.</p><div class="num">5</div>`,
n:{tm:"min 62",g:`<p>Llegamos al bloque más largo, unos 25 minutos, porque aquí está todo el segundo corte: las técnicas. De cada técnica pueden preguntar la definición, las características, las ventajas y desventajas, cómo se hace y un uso real.</p>`,x:["Bloque de 25 minutos: 11 diapositivas. Las de seminario alemán, socrático y debate son de 1–2 minutos cada una."]}},

{s:5,t:"El acto didáctico",
h:`<div class="formula"><span class="n">Docente</span><span class="n">Alumno</span><span>Contenido</span><span>Estrategia</span><span class="g">Contexto</span></div>
<div class="flow"><div><span class="n">1</span><b>Diagnóstico</b>¿qué necesitan?</div><div><span class="n">2</span><b>Planificación</b>¿qué y cómo?</div><div><span class="n">3</span><b>Implementación</b>¿cómo lo vivimos?</div><div><span class="n">4</span><b>Evaluación</b>¿lo lograron?</div></div>
<div class="st c3">${C(`<h4><i></i>Pre-instruccional</h4>inicio`,'s')}${C(`<h4><i></i>Co-instruccional</h4>desarrollo`,'s')}${C(`<h4><i></i>Post-instruccional</h4>cierre y evaluación`,'g')}</div>`,
n:{tm:"min 62 – 66",g:`<p><b>Didáctica</b> viene del griego <i>didaskein</i>, enseñar. Su padre es Juan Amós Comenio, teólogo, filósofo y pedagogo nacido en Moravia en 1592 y muerto en Ámsterdam en 1670, que en 1640 publicó la <b>Didáctica Magna</b>, organizada en tres partes: didáctica general, didáctica especial y organización escolar.</p>
<p>El acto didáctico tiene cinco componentes: siempre hay alguien que enseña, el <b>docente</b>; alguien que aprende, el <b>alumno</b>; algo que enseñar, el <b>contenido</b>; una forma de enseñar, la <b>estrategia</b>; y un espacio, el <b>contexto</b>.</p>
<p>El ciclo del proceso educativo tiene cuatro pasos: <b>diagnóstico</b>, ¿qué necesitan aprender?; <b>planificación</b>, ¿qué enseñar y cómo organizarlo?; <b>implementación</b>, ¿cómo desarrollar la experiencia?; y <b>evaluación</b>, ¿cómo verificar el aprendizaje?</p>
<p>Y las estrategias según el momento de la clase: las <b>pre-instruccionales</b> van al inicio, activan conocimientos previos y presentan el objetivo; las <b>co-instruccionales</b> van en el desarrollo, organizan, enlazan y mantienen la atención; y las <b>post-instruccionales</b> van al cierre, sintetizan, integran y valoran lo aprendido.</p>`,
x:["Relación: pre-instruccionales ↔ diagnóstico y planificación; co ↔ implementación; post ↔ evaluación.","Métodos de enseñanza (definición de la profe): medios que usa la didáctica para orientar la enseñanza-aprendizaje; todas sus acciones buscan cumplir un objetivo.","El plan calendario también habla de la 'estructura funcional de la sesión educativa' y la 'ruta metodológica': inicio, desarrollo, cierre y evaluación."],
p:"'Lluvia de ideas al inicio para saber qué sabe el grupo' → estrategia pre-instruccional. 'Mapa conceptual al final' → post-instruccional."}},

{s:5,t:"Cuatro familias de técnicas",
h:`<div class="st c4">${C(`<h4><i></i>Entrenamiento</h4>rol play<br>demostración<br>simulación`,'n')}${C(`<h4><i></i>Activas</h4>teatro<br>sociodrama<br>storytelling<br>ABP · cine foro`,'s')}${C(`<h4><i></i>Reflexión y análisis</h4>seminario alemán<br>seminario socrático<br>debate · Phillips 66`,'g')}${C(`<h4><i></i>Transmisión</h4>expositiva<br>lluvia de ideas<br>interrogativa`)}</div>
<div class="hero">La técnica se elige por el <b>objetivo</b>, el <b>contexto</b> y los <b>estudiantes</b>.</div>`,
n:{tm:"min 66 – 68",g:`<p>Este es el mapa de todo el segundo corte. Las <b>técnicas de entrenamiento</b> permiten adquirir habilidades y destrezas mediante la práctica guiada. Las <b>activas</b> convierten al estudiante en protagonista y creador de su aprendizaje. Las de <b>reflexión y análisis</b> favorecen el pensamiento crítico, la argumentación y los juicios propios. Y las de <b>transmisión y comprensión</b> facilitan organizar, presentar y comprender la información.</p>
<p>La nota amarilla del mapa de la profe dice algo que pueden usar como respuesta abierta: el docente elige la técnica según los objetivos de aprendizaje, el contexto y las características de sus estudiantes. No hay una técnica mejor que otra en abstracto.</p>`,
x:["Definición general (mapa de la profe): estrategias que usa el docente para facilitar el aprendizaje significativo, desarrollando conocimientos, habilidades, actitudes y valores."],
p:"Clasificación rápida: si el foco es practicar → entrenamiento; crear o representar → activas; argumentar o leer críticamente → reflexión; recibir y comprender información → transmisión.",
v:"En la tutoría del primer parcial el seminario alemán, el socrático y el debate quedaron dentro de 'entrenamiento'; en el plan calendario y en el mapa de la profe están en 'reflexión y análisis'. Usa esta última."}},

{s:5,t:"Entrenamiento",
h:`<div class="st c3">${C(`<h4><i></i>Rol play</h4><span class="k">empatía</span>los estudiantes asumen otro papel<br><span class="mut">clave: debriefing</span>`,'s')}${C(`<h4><i></i>Demostración</h4><span class="k">modelamiento</span>el experto muestra paso a paso<br><span class="mut">clave: redemostración</span>`,'s')}${C(`<h4><i></i>Simulación</h4><span class="k">decidir</span>escenario clínico completo<br><span class="mut">clave: pre → escenario → debriefing</span>`,'g')}</div>
<div class="trap">En la simulación, el aprendizaje central ocurre en el debriefing.</div>`,
n:{tm:"min 68 – 72",g:`<p>Las tres comparten un principio: la práctica deliberada antes de enfrentar a un paciente real. Se diferencian en quién protagoniza y en qué se aprende.</p>
<p>El <b>rol play</b> o juego de roles: los estudiantes asumen un papel distinto al propio (paciente, familiar, colega, jefe) para vivir la situación desde otra perspectiva. A diferencia de la simulación, el énfasis está en la interacción humana y emocional: comunicación, actitudes, manejo de conflictos. Es barato y se hace en el aula. Se hace así: objetivo, caso breve con roles, unos minutos de preparación, escena de 2 a 5 minutos, debriefing ("¿qué sintió cada rol?") y, si se puede, repetir. Ejemplo real: dar una mala noticia a un familiar.</p>
<p>La <b>demostración</b>: el docente o un experto ejecuta un procedimiento paso a paso frente al grupo, verbalizando cada paso, y luego el estudiante lo redemuestra bajo supervisión. Se basa en el modelamiento: aprendo viendo a un experto. Ejemplo: guantes estériles o una inyección intramuscular.</p>
<p>La <b>simulación</b> recrea con distintos niveles de fidelidad (maniquíes, pacientes estandarizados, entornos virtuales) una situación clínica completa, y el estudiante toma decisiones como en la práctica, sin riesgo para un paciente real. Tiene tres fases: el <b>prebriefing</b>, que orienta, baja la ansiedad y establece el "contrato de ficción"; el <b>escenario</b>, donde el estudiante actúa y el facilitador observa sin intervenir; y el <b>debriefing</b>, donde el grupo reflexiona sobre lo que pasó. Ejemplo: un paro cardiorrespiratorio en maniquí de alta fidelidad.</p>`,
x:["Rol play: ventajas → empatía, comunicación asertiva, bajo costo, espacio seguro para equivocarse. Desventajas → pena en tímidos, el realismo depende de la actuación, sin buen debriefing se queda en anécdota.","Demostración: ventajas → reduce errores, eficiente para grupos grandes, estandariza la técnica. Desventajas → el estudiante está pasivo mientras observa, en grupos grandes no todos ven los detalles, no garantiza retención sin práctica.","Simulación: ventajas → decidir bajo presión sin riesgo, integra saberes, muy motivadora. Desventajas → costosa, requiere tiempo, equipos y facilitadores entrenados; puede generar ansiedad.","Preguntas del debriefing: ¿qué pasó?, ¿por qué actuó así?, ¿qué haría diferente?"],
p:"'¿Qué técnica privilegia la comunicación y las emociones sobre la ejecución técnica?' → rol play. '¿Cuál integra juicio clínico, técnica y decisión?' → simulación."}},

{s:5,t:"Activas",
h:`<div class="st c5">${C(`<h4><i></i>Teatro</h4>guion, actores, público`,'s')}${C(`<h4><i></i>Sociodrama</h4>conflicto social real, espontáneo`,'s')}${C(`<h4><i></i>Storytelling</h4>historias con propósito`,'s')}${C(`<h4><i></i>ABP</h4>un problema dispara el aprendizaje`,'g')}${C(`<h4><i></i>Cine foro</h4>película + preguntas`,'s')}</div>
<div class="formula" style="font-size:17px"><span>1 aclarar</span><span>2 definir</span><span>3 lluvia</span><span>4 organizar</span><span class="g">5 objetivos</span><span>6 estudiar</span><span class="n">7 sintetizar</span></div>
<div class="hero">ABP: el docente es <b>tutor</b>, no transmisor.</div>`,
n:{tm:"min 72 – 76",g:`<p>En las técnicas activas el estudiante escribe, actúa, narra o investiga.</p>
<p>El <b>teatro</b> usa la representación en vivo con actores, diálogos, escenografía y público. Puede ser improvisado o guionado, y el guion tiene inicio, nudo y desenlace; hay actores que interpretan y un director que guía. Ejemplo: dramatizar el impacto de una enfermedad crónica en la familia.</p>
<p>El <b>sociodrama</b> es distinto: lo representa el propio grupo, de forma espontánea y breve, con elementos escénicos mínimos, y busca analizar o transformar un conflicto social real. Hay dos tipos: de <b>adaptación</b>, para adquirir patrones de conducta y dominar un contexto; y <b>emancipador</b>, para comprender esos patrones, liberarse de convenciones y cambiar la realidad. Ejemplo: barreras de acceso a salud en población vulnerable.</p>
<p>El <b>storytelling</b> es contar historias con un propósito educativo para emocionar y conectar. Tiene estructura de inicio, desarrollo y cierre, y tipos: narrativo, visual, digital, colaborativo y personal.</p>
<p>El <b>ABP</b>, aprendizaje basado en problemas: pequeños grupos parten de un caso real, identifican lo que necesitan aprender, investigan y construyen el conocimiento, con el docente como tutor. Sigue los siete pasos: aclarar términos, definir el problema, lluvia de ideas, organizar las ideas, formular objetivos de aprendizaje, estudio autodirigido y compartir y sintetizar.</p>
<p>Y el <b>cine foro</b>: proyectar una película o un fragmento con una guía de preguntas y una discusión moderada.</p>`,
x:["Teatro vs. sociodrama: el teatro es artístico, guionado y con público; el sociodrama es espontáneo y lo hacen los propios involucrados para analizar un problema social.","ABP (problemas) vs. ABPry (proyectos): el ABP resuelve un caso; el ABPry construye un producto final tangible a lo largo del tiempo.","ABP: desventajas → más tiempo que la clase magistral, exige tutores entrenados, frustración inicial, riesgo de vacíos si no se investiga a fondo.","Storytelling: recomendaciones → objetivo claro, conocer al público, historias breves y emotivas, terminar con una reflexión.","Cine foro: riesgo de distracción si la película es larga; depende de proyector y sala."],
p:"'Representación espontánea de un problema social por los propios participantes' → sociodrama, no teatro."}},

{s:5,t:"Reflexión y análisis",
h:`<div class="st c3">${C(`<h4><i></i>Seminario alemán</h4><span class="k">leer antes</span>relator · secretario · participantes`,'s')}${C(`<h4><i></i>Seminario socrático</h4><span class="k">preguntar</span>el facilitador no responde: mayéutica`,'g')}${C(`<h4><i></i>Debate</h4><span class="k">argumentar</span>dos posturas, tiempos y moderador`,'s')}</div>
<div class="hero">Leer juntos · descubrir preguntando · defender con evidencia.</div>`,
n:{tm:"min 76 – 78",g:`<p>Estas técnicas ponen el acento en el pensamiento profundo: leer, cuestionar y argumentar.</p>
<p>El <b>seminario alemán</b> es estudio grupal sobre un texto. La condición indispensable es la <b>lectura previa</b> individual. Hay roles fijos: el relator o moderador, que presenta el texto y guía la discusión para que no se desvíe; el secretario, que registra las conclusiones; y los participantes. El objetivo no es memorizar sino comprender el texto en profundidad y de forma compartida. Ejemplo: analizar en grupo un artículo sobre una guía de práctica clínica antes de aplicarla.</p>
<p>El <b>seminario socrático</b> se basa en la mayéutica: el facilitador no entrega respuestas, formula preguntas abiertas y sucesivas para que los estudiantes razonen y descubran. Repregunta: "¿por qué piensa eso?", "¿qué pasaría si…?". Importa el proceso de razonamiento, no una única respuesta. Ejemplo: "¿hasta dónde llega la autonomía del paciente frente al criterio del equipo?".</p>
<p>El <b>debate</b>: dos posturas contrapuestas sobre un mismo tema, defendidas en un formato con tiempos de apertura, réplica y cierre, y con un moderador. Exige preparar argumentos con evidencia, incluso si la postura no coincide con la opinión propia. Ejemplo: vacunación obligatoria o eutanasia.</p>`,
x:["Seminario alemán: depende totalmente de la lectura previa; puede volverse monótono si el moderador no dinamiza.","Socrático: exige un facilitador experto en preguntas y puede incomodar a quien espera respuestas directas.","Debate: puede polarizar si no se modera; el cierre debe rescatar aprendizajes, no 'quién ganó'."],
p:"'¿En qué técnica el facilitador pregunta pero no responde?' → seminario socrático. '¿Cuál requiere lectura previa y roles de relator y secretario?' → seminario alemán."}},

{s:5,t:"Seminario alemán",
h:`<div class="st c3">${C(`<h4><i></i>Relator</h4>presenta el texto y guía la discusión`,'s')}${C(`<h4><i></i>Secretario</h4>registra puntos y conclusiones`,'g')}${C(`<h4><i></i>Participantes</h4>leyeron antes y discuten`,'s')}</div>
<div class="flow"><div><span class="n">1</span><b>Texto previo</b>se envía con tiempo</div><div><span class="n">2</span><b>Roles</b>se asignan</div><div><span class="n">3</span><b>Relatoría</b>presenta el texto</div><div><span class="n">4</span><b>Discusión</b>preguntas clave</div><div><span class="n">5</span><b>Síntesis</b>el secretario cierra</div></div>
<div class="hero">Sin lectura previa <b>no hay seminario</b>.</div>`,
n:{tm:"min 78 – 80",g:`<p>El <b>seminario alemán</b> es una técnica de estudio en grupo sobre un texto o un tema. Lo que lo define es que exige una <b>lectura previa obligatoria</b>: si el grupo no leyó, no hay seminario.</p>
<p>Tiene roles fijos. El <b>relator</b>, que a veces también hace de moderador, presenta el texto al inicio y guía la discusión para que no se desvíe. El <b>secretario</b> anota los puntos importantes y las conclusiones. Y los <b>participantes</b>, que ya leyeron, aportan, preguntan y discuten.</p>
<p>Se hace en cinco pasos: se selecciona un texto pertinente y se envía con anticipación; se asignan los roles; el relator abre con una breve presentación del texto; se discute a partir de preguntas clave; y al final el secretario sintetiza las conclusiones y se comparten con todo el grupo.</p>
<p>El objetivo no es memorizar el texto, sino comprenderlo en profundidad y construir una síntesis colectiva más rica que la que lograría cada uno leyendo solo.</p>`,
x:["Ventajas: desarrolla lectura crítica y análisis de fuentes; reparte responsabilidades, así que todos participan; prepara para dinámicas de posgrado y trabajo científico.","Desventajas: depende totalmente de la lectura previa; puede volverse monótono si el relator no dinamiza; requiere tiempo de preparación fuera de clase.","Uso en enfermería: analizar en grupo un artículo científico o una guía de práctica clínica antes de aplicarla en el servicio.","Recuerda el dato de Nérici: el seminario es el ejemplo de técnica que, aplicada con suficiente amplitud, se convierte en método."],
p:"'¿Qué técnica exige lectura previa y roles de relator y secretario?' → seminario alemán."}},

{s:5,t:"Seminario socrático",
h:`<div class="formula" style="justify-content:center"><span class="n">Ironía</span><em>+</em><span class="g">Mayéutica</span><em>=</em><span>descubrir preguntando</span></div>
<div class="st c2">${C(`<h4><i></i>El facilitador</h4><span class="k">pregunta</span>no expone, no da la respuesta`,'s')}${C(`<h4><i></i>Los estudiantes</h4><span class="k">razonan</span>se cuestionan entre ellos`,'g')}</div>
<div class="hero">"¿Por qué piensa eso?" · "¿Qué pasaría si…?"</div>`,
n:{tm:"min 80 – 82",g:`<p>El <b>seminario socrático</b> viene del método de Sócrates, que tenía dos momentos: la <b>ironía</b>, hacer ver al otro que no sabe lo que cree saber, y la <b>mayéutica</b>, que significa el arte de la partera: ayudar a "dar a luz" el conocimiento mediante preguntas hábiles.</p>
<p>En clase funciona así: el facilitador no expone ni entrega respuestas; formula <b>preguntas abiertas</b> y sucesivas que cuestionan los supuestos del grupo, para que sean los propios estudiantes quienes, razonando, construyan el conocimiento. Lo importante es el proceso de razonamiento, no llegar a una única respuesta correcta.</p>
<p>Los pasos: elegir un dilema o pregunta central abierta, por ejemplo un dilema ético; preparar preguntas orientadoras; en vez de dar la respuesta, repreguntar: "¿por qué piensa eso?", "¿qué pasaría si…?"; dejar que los estudiantes debatan entre sí; y cerrar sintetizando los razonamientos sin imponer una conclusión.</p>`,
x:["Diferencia con el seminario alemán: el alemán gira alrededor de un texto con roles fijos; el socrático gira alrededor de preguntas del facilitador.","Ventajas: pensamiento crítico y autónomo, enseña a argumentar y a tolerar otros puntos de vista, el aprendizaje descubierto se retiene mejor.","Desventajas: exige un facilitador experto en preguntar, incomoda a quien espera respuestas directas, toma más tiempo que una exposición.","Conecta con el método heurístico del bloque 3 y con la técnica interrogativa de enfoque heurístico.","Uso en enfermería: '¿hasta dónde llega la autonomía del paciente frente al criterio del equipo de salud?'."],
p:"'Técnica en la que el facilitador pregunta y no responde' → seminario socrático. 'Mayéutica' es la palabra clave."}},

{s:5,t:"Debate",
h:`<div class="formula" style="justify-content:center"><span class="n">A favor</span><em>⇄</em><span class="g">En contra</span></div>
<div class="flow"><div><span class="n">1</span><b>Tema</b>controversial y pertinente</div><div><span class="n">2</span><b>Posturas</b>asignadas o elegidas</div><div><span class="n">3</span><b>Preparación</b>argumentos con evidencia</div><div><span class="n">4</span><b>Formato</b>apertura · réplica · cierre</div><div><span class="n">5</span><b>Reflexión</b>más allá de ganar</div></div>
<div class="hero">Defender una postura <b>aunque no sea la propia</b>.</div>`,
n:{tm:"min 82 – 83",g:`<p>En el <b>debate</b> dos posturas contrapuestas sobre un mismo tema, a favor y en contra, son defendidas por grupos o personas en un formato estructurado, con tiempos y reglas, y con un <b>moderador</b> que hace cumplir los tiempos y el respeto.</p>
<p>Se hace así: se elige un tema controversial y pertinente; se divide el grupo en dos posturas, asignadas o elegidas; se da tiempo para investigar y preparar argumentos con evidencia; se define el formato, con tiempos de apertura, réplica y cierre para cada bando; se modera; y se cierra con una reflexión grupal que vaya más allá de quién ganó.</p>
<p>Lo formativo es que obliga a argumentar con evidencia, escuchar activamente y defender una postura incluso si no coincide con la opinión personal, lo que desarrolla un pensamiento más flexible.</p>`,
x:["Ventajas: argumentación con evidencia, expresión oral, escucha activa, análisis desde varias perspectivas.","Desventajas: puede polarizar si no se modera bien; sin preparación previa se queda superficial; los tiempos estrictos limitan la profundidad.","Uso en enfermería: vacunación obligatoria, eutanasia o limitación del esfuerzo terapéutico.","El plan calendario usó un debate o conversatorio en la clase de 'Rol de enfermería como educador'."],
p:"'Técnica con dos posturas opuestas, tiempos de réplica y un moderador' → debate."}},

{s:5,t:"Phillips 66",
h:`<div class="six">6<i>·</i>6</div>
<div class="formula" style="justify-content:center"><span class="n">6 personas</span><span class="g">6 minutos</span><span>≈ 1 minuto cada una</span></div>
<div class="flow"><div><span class="n">1</span><b>Consigna</b>una pregunta concreta</div><div><span class="n">2</span><b>Subgrupos</b>moderador y secretario</div><div><span class="n">3</span><b>6 minutos</b>todos hablan</div><div><span class="n">4</span><b>Plenaria</b>cada grupo comparte</div></div>`,
n:{tm:"min 83 – 85",g:`<p>La técnica que más me piden repasar. <b>Phillips 66</b> es una dinámica grupal: el grupo grande se divide en subgrupos de <b>seis personas</b> que discuten un tema durante <b>seis minutos</b>, más o menos un minuto por persona, para generar ideas, asegurar que todos participen y sintetizar conclusiones de forma ágil.</p>
<p>Cómo se hace: primero, el docente da una consigna clara, una pregunta concreta. Segundo, se forman los subgrupos de seis y cada uno nombra un moderador, que da la palabra y cuida el tiempo, y un secretario, que anota. Tercero, seis minutos de discusión donde todos aportan. Cuarto, plenaria: cada secretario comparte las conclusiones de su grupo y se hace una síntesis general.</p>
<p>Sirve para tomar decisiones rápidas, explorar conocimientos previos, generar ideas y hacer debates breves. Tiene dos tipos: la <b>tradicional</b>, seis y seis estrictos, y la <b>adaptada</b>, donde se ajustan el número de personas y el tiempo según el tamaño del grupo y lo complejo del tema.</p>`,
x:["Ventajas: alta participación de todo el grupo en poco tiempo; dinámica; se usa en cualquier momento de la clase; estimula el pensamiento crítico y colaborativo.","Desventajas: superficial si el tema es complejo; exige organización previa y control estricto del tiempo; no todos los subgrupos profundizan igual.","Recomendaciones: un moderador por subgrupo, asegurar que todos hablen, registrar conclusiones, consignas claras antes de iniciar.","Origen: la propuso J. Donald Phillips, de la Universidad Estatal de Michigan, a fines de los años 40.","Ejemplo real: al iniciar una clase, subgrupos de seis responden en seis minutos '¿qué saben de los tipos de evaluación?' → activa saberes previos (pre-instruccional)."],
p:"'¿Qué técnica asegura que todos participen en un grupo grande y en poco tiempo?' → Phillips 66."}},

{s:5,t:"Transmisión y comprensión",
h:`<div class="st c3">${C(`<h4><i></i>Expositiva</h4><span class="k">el docente habla</span>intro · desarrollo · síntesis<br><span class="mut">pausa activa cada 10–15 min</span>`,'s')}${C(`<h4><i></i>Lluvia de ideas</h4><span class="k">divergir → converger</span>cantidad antes que calidad`,'g')}${C(`<h4><i></i>Interrogativa</h4><span class="k">preguntar con intención</span>cerradas · abiertas · tiempo de espera`,'s')}</div>
<div class="hero">El problema no es exponer: es el <b>verbalismo pasivo</b>.</div>`,
n:{tm:"min 85 – 86",g:`<p>La <b>técnica expositiva</b> o clase magistral: el docente presenta, organiza y explica de forma estructurada, con introducción, desarrollo y síntesis. Es eficiente para mucho contenido y para temas nuevos, pero la atención cae después de 15 a 20 minutos, por eso hay que intercalar preguntas o pausas activas cada 10 a 15 minutos.</p>
<p>La <b>lluvia de ideas</b> tiene dos fases: una <b>divergente</b>, generar la mayor cantidad posible de ideas sin juzgarlas, "cantidad antes que calidad"; y una <b>convergente</b>, agrupar, organizar y seleccionar las más pertinentes. Necesita un moderador que registre todo a la vista. Sirve al inicio o al cierre.</p>
<p>La <b>interrogativa</b> usa preguntas intencionadas para activar saberes previos, verificar comprensión o guiar el descubrimiento. Las preguntas pueden ser cerradas, que verifican un dato, o abiertas, que hacen razonar; y el enfoque puede ser dogmático, buscando la respuesta esperada, o heurístico, cercano al socrático. Hay que dar tiempo de espera y no ridiculizar los errores.</p>`,
x:["Expositiva: ventaja → mucho contenido en poco tiempo y estandariza para grupos grandes; desventaja → rol pasivo y no verifica la comprensión en tiempo real.","Lluvia de ideas: se dispersa sin moderador y algunos hablan más que otros.","Interrogativa: si predominan las preguntas cerradas, favorece la memorización."],
p:"'Fase en la que se generan ideas sin juzgarlas' → fase divergente de la lluvia de ideas."}},

{s:5,t:"Experiencias de aprendizaje y recursos",
h:`<div class="st c2">${C(`<h4><i></i>Actividad</h4>una acción puntual<br><span class="mut">leer un artículo</span>`,'s')}${C(`<h4><i></i>Experiencia</h4>un diseño integral con reflexión<br><span class="mut">simulación con pre y debriefing</span>`,'g')}</div>
<div class="formula" style="font-size:18px"><span>Clase invertida</span><span>ABPry</span><span>Gamificación</span><span>Minuto de papel</span><span class="n">Dale 1946</span></div>
<div class="formula" style="font-size:18px"><span class="g">RTF</span><span class="g">CTF</span><span class="g">CRTT</span><span class="g">ERTF</span><em>·</em><span>La IA genera; el docente decide</span></div>`,
n:{tm:"min 86 – 87",g:`<p>Una <b>actividad</b> de aprendizaje es una acción puntual, como leer un artículo sobre insuficiencia cardíaca. Una <b>experiencia</b> de aprendizaje es un diseño intencionado e integral que conecta con la realidad, moviliza emociones, exige participación y termina en reflexión, como una simulación de un paciente descompensado con prebriefing, escenario y debriefing. Toda experiencia tiene actividades, pero una actividad sola no es una experiencia.</p>
<p>El antecedente es el <b>cono de la experiencia de Edgar Dale</b>, de 1946, que organiza las formas de aprender desde lo más abstracto, los símbolos verbales, hasta lo más concreto, la experiencia directa con propósito.</p>
<p>Estrategias: la <b>clase invertida</b>, teoría en casa y aplicación en clase; el <b>aprendizaje basado en proyectos</b>, con un producto final tangible; la <b>gamificación</b>, puntos, retos y retroalimentación inmediata, como Kahoot; y las actividades de fijación, como el minuto de papel, el mapa conceptual de cierre o enseñarle a un compañero.</p>
<p>Y de recursos digitales: para la IA, un buen prompt tiene estructura. RTF es rol, tarea y formato; CTF, contexto, tarea y formato; CRTT añade el tono; y ERTF añade un ejemplo. El lema del taller fue: la IA genera, el docente decide, revisa y transforma.</p>`,
x:["Principios de una experiencia: intencionalidad, participación activa, conexión con la realidad, reflexión, progresividad, retroalimentación y significatividad emocional.","Los porcentajes del cono de Dale ('recordamos el 10% de lo que leemos…') no son de Dale ni tienen respaldo científico. Si salen en una opción, desconfía.","Organizadores gráficos: jerarquía → mapa conceptual; ideas libres → mapa mental; comparar → cuadro comparativo; tiempo → línea de tiempo; pasos y decisiones → diagrama de flujo; causas → Ishikawa; público amplio → infografía.","Riesgos de la IA: alucinaciones (inventa referencias), sesgos, privacidad (nunca datos identificables de pacientes), derechos de autor."],
p:"'Diferencia entre actividad y experiencia de aprendizaje' → la experiencia es integral e incluye reflexión; la actividad es puntual."}},

{s:6,k:"div",t:"Evaluación en educación y prueba objetiva",h:`<p>Juzgar el aprendizaje con instrumentos justos y preguntas bien hechas.</p><div class="num">6</div>`,
n:{tm:"min 87",g:`<p>Sexto bloque, la clase de la profesora Yadira sobre evaluación. Es clave porque el examen de mañana está construido con estas mismas reglas: entender cómo se hace un ítem les ayuda a responderlo.</p>`,x:["Bloque de 20 minutos: 7 diapositivas."]}},

{s:6,t:"Evaluar es emitir juicios de valor",
h:`<div class="quote">Evaluar es determinar hasta qué punto se alcanzaron los objetivos.<small>Ralph Tyler, 1950 · padre de la evaluación educacional</small></div>
