<div class="st c3">${C(`<h4><i></i>Decreto 1290 de 2009</h4>SIEE · superior, alto, básico, bajo`,'s')}${C(`<h4><i></i>Ley 1324 de 2009</h4>ICFES · Saber 11, TyT y Pro`,'s')}${C(`<h4><i></i>Ley 30, art. 28</h4>autonomía universitaria`,'s')}</div>
<div class="hero">Continua · integral · sistemática · flexible · participativa · <b>formativa</b></div>`,
n:{tm:"min 87 – 90",g:`<p>La <b>evaluación</b> es un proceso sistemático y continuo de recolectar, analizar e interpretar información sobre el aprendizaje para emitir <b>juicios de valor</b> y tomar decisiones: ajustar la enseñanza, certificar un logro o retroalimentar al estudiante. Suchman, en 1972, lo resume: evaluar es emitir juicios de valor. Y es un término genérico que incluye varios procedimientos para conocer el aprendizaje y formar juicios sobre él.</p>
<p><b>Ralph Tyler</b>, en 1950, es el padre de la evaluación educacional: para él, evaluar es determinar hasta qué punto los objetivos educativos se han alcanzado mediante los programas y currículos.</p>
<p>En normatividad: el <b>Decreto 1290 de 2009</b>, hoy compilado en el 1075 de 2015, crea el Sistema Institucional de Evaluación de los Estudiantes, el SIEE, con la escala nacional superior, alto, básico y bajo. El <b>ICFES</b>, con la Ley 1324 de 2009, hace las pruebas externas: Saber 11, Saber TyT y Saber Pro, entre otras, y participa en PISA. En la universidad, la autonomía universitaria del artículo 69 de la Constitución y el artículo 28 de la Ley 30 permite que cada institución defina su evaluación.</p>
<p>Los principios: continua, integral (conocimientos, habilidades y actitudes), sistemática, flexible, participativa y, sobre todo, formativa: su fin último es mejorar el proceso, no solo calificar.</p>`,
x:["Supervisión educativa ≠ evaluación: la supervisión acompaña y asesora el proceso educativo institucional (desempeño docente, currículo); la evaluación se centra en el aprendizaje del estudiante.","Evaluación de proceso (el camino, como la participación en una simulación) vs. de producto (el resultado final, como un examen)."],
p:"'¿A quién se considera padre de la evaluación educacional?' → Ralph Tyler.",
v:"En la diapositiva de la profe, la lista de pruebas del ICFES dice 'Avancemos 4.°, 6.°, 8.°'; revisa ese nombre si lo preguntan."}},

{s:6,t:"Tipos de evaluación",
h:`<table class="t"><tr><th>Según…</th><th>Tipos</th></tr>
<tr><td>El momento</td><td>inicial · procesual · final</td></tr>
<tr><td>La finalidad</td><td>diagnóstica · formativa · sumativa</td></tr>
<tr><td>La extensión</td><td>global · parcial</td></tr>
<tr><td>Los agentes</td><td>autoevaluación · heteroevaluación · coevaluación</td></tr>
<tr><td>La procedencia</td><td>interna · externa</td></tr>
<tr><td>El normotipo</td><td>normativa · criterial</td></tr></table>`,
n:{tm:"min 90 – 93",g:`<p>Seis criterios. Según el <b>momento</b>: inicial, procesual y final. Según la <b>finalidad</b>: la <b>diagnóstica</b>, al inicio, identifica saberes previos y necesidades; la <b>formativa</b>, durante el proceso, retroalimenta y permite ajustar sobre la marcha; y la <b>sumativa</b>, al final, certifica el nivel de logro y suele traducirse en nota.</p>
<p>Según la <b>extensión</b>: global, si abarca todo el proceso, o parcial, si evalúa una parte. Según los <b>agentes</b>: <b>autoevaluación</b>, me evalúo yo; <b>heteroevaluación</b>, me evalúa otro, normalmente el docente; y <b>coevaluación</b>, nos evaluamos entre pares con criterios definidos.</p>
<p>Según la <b>procedencia</b> de quien evalúa: interna, de la misma institución, o externa, como el ICFES. Y según el <b>normotipo</b>, es decir, con qué se compara el resultado: <b>normativa</b>, se compara con el rendimiento del grupo; <b>criterial</b>, se compara con criterios fijados de antemano.</p>`,
x:["Ejemplos: un quiz sin nota al iniciar el corte → diagnóstica. Retroalimentación tras cada simulación → formativa. Examen final → sumativa.","Saber Pro → evaluación externa."],
p:"Trampa: coevaluación es entre PARES. Si evalúa el docente, es heteroevaluación."}},

{s:6,t:"Instrumentos y pirámide de Miller",
h:`<div class="st c2" style="align-items:center"><div class="pyr"><div>Hace<small>práctica real · Mini-CEX · portafolio</small></div><div>Muestra cómo<small>simulación · ECOE</small></div><div>Sabe cómo<small>casos · ABP · ensayos</small></div><div>Sabe<small>opción múltiple · preguntas abiertas</small></div></div>
<div class="st">${C(`<h4><i></i>Lista de chequeo</h4>sí / no · no gradúa calidad`,'s')}${C(`<h4><i></i>Rúbrica</h4>criterios × niveles con descriptores`,'s')}${C(`<h4><i></i>Anecdotario</h4>hechos observados, sin interpretar`,'s')}${C(`<h4><i></i>ECOE</h4>estaciones estandarizadas con tiempo`,'g')}</div></div>`,
n:{tm:"min 93 – 97",g:`<p>La <b>pirámide de Miller</b>, de 1990, organiza la competencia profesional en cuatro niveles. Los dos de abajo son teoría: <b>sabe</b>, el conocimiento, que se evalúa con preguntas de opción múltiple o abiertas; y <b>sabe cómo</b>, aplicar ese conocimiento, que se evalúa con análisis de casos, ABP, ensayos o mapas. Los dos de arriba son práctica: <b>muestra cómo</b>, el desempeño en un ambiente simulado, que se evalúa con simulación y ECOE; y <b>hace</b>, el desempeño real con pacientes, que se evalúa con Mini-CEX, portafolio, observación en la práctica o evaluación 360°.</p>
<p>Los instrumentos: la <b>lista de chequeo</b> registra si un paso está o no está, sí o no, sin graduar la calidad; es ideal para pasos críticos como la higiene de manos. La <b>rúbrica</b> es una matriz de criterios por niveles de desempeño con descriptores. El <b>anecdotario</b> registra de forma breve y objetiva hechos significativos en el momento en que ocurren, sin interpretarlos; sirve para actitudes. Y el <b>ECOE</b>, examen clínico objetivo estructurado, hace rotar al estudiante por estaciones breves y estandarizadas, cada una con su lista de chequeo o rúbrica.</p>`,
x:["Tabla de la profe, técnica → instrumento: observación → anecdotario, guía de observación, diario de clase; interrogatorio → ensayo, debate, prueba objetiva, quiz; análisis de desempeño → portafolio, rúbrica, escala de apreciación, lista de chequeo; desempeño del estudiante → demostración, Mini-CEX, ECOE.","Rúbrica analítica: puntúa cada criterio por separado; holística: un juicio global.","Guía de aprendizaje: integra objetivos, contenidos, actividades y criterios de evaluación en un solo documento.","El ECOE (OSCE en inglés) suele tener entre 5 y 15 estaciones; fue propuesto por Harden en los años 70."],
p:"Trampa: el ECOE con pacientes estandarizados es 'muestra cómo', NO 'hace'. 'Hace' es la práctica real."}},

{s:6,t:"La prueba objetiva",
h:`<div class="st c3">${C(`<h4><i></i>Confiabilidad</h4>mismos resultados al repetir`,'s')}${C(`<h4><i></i>Validez</h4>mide lo que dice medir`,'g')}${C(`<h4><i></i>Equilibrio</h4>temas, competencias y dificultad`,'s')}</div>
<div class="formula"><span>Contexto</span><em>→</em><span>Enunciado</span><em>→</em><span class="n">Clave</span><span class="g">Distractores</span></div>
<div class="hero">La clave se distingue por su <b>contenido</b>, no por sutilezas del lenguaje.</div>`,
n:{tm:"min 97 – 99",g:`<p>Una <b>prueba objetiva</b> es aquella cuya calificación no depende de quien corrige: hay criterios acordados desde la construcción. Sus características: hay una estructura de prueba previa; mide con un número; los ítems tienen un número limitado de opciones; todos presentan la misma prueba en las mismas condiciones; y permite evaluar grupos grandes de forma masiva.</p>
<p>Para cumplir su fin necesita tres atributos. <b>Confiabilidad</b>: si la aplico en distintos momentos, en condiciones idénticas, obtengo resultados similares. <b>Validez</b>: mide lo que pretende medir. Se pierde si el ítem no es relevante, si incluye información que facilita o dificulta la respuesta, o si las preguntas se conocen antes. Y <b>equilibrio</b>: proporción adecuada de preguntas por componente, por competencia y por dificultad baja, media y alta.</p>
<p>Un ítem tiene tres partes: el <b>contexto</b>, la información necesaria (un texto, una gráfica, un caso); el <b>enunciado</b>, la tarea que debe resolverse, clara y completa; y las <b>opciones</b>: la <b>clave</b>, que es la única válida, y los <b>distractores</b>, que no responden bien pero son plausibles para quien no domina el tema.</p>`,
x:["Antes de escribir ítems se arma la tabla de especificaciones: cruza temas con competencias y define cuántos ítems van en cada celda.","Un distractor puede ser un error común o una afirmación verdadera que no responde completamente la pregunta.","Las pruebas objetivas deben ser también un instrumento pedagógico, no reforzar el aprendizaje memorístico."],
p:"'Si las preguntas se filtran antes del examen, ¿qué atributo se pierde?' → validez."}},

{s:6,t:"Tipos de preguntas",
h:`<div class="st c2">${C(`<h4><i></i>Selección de respuesta</h4>selección múltiple · apareamiento · selección alterna · falso-verdadero · dependientes de contexto`,'s')}${C(`<h4><i></i>Producción de respuesta</h4>completar · ensayo corto, largo u oral · ejecución · productos no escritos`,'g')}</div>
<div class="formula" style="font-size:18px"><span class="n">I · SMUR</span><span>IV · SMMR</span><span>VI · SMIS</span><span>VII · AP</span><span class="g">VIII · AR</span></div>
<div class="hero">Análisis de relación: afirmación <b>PORQUE</b> razón.</div>`,
n:{tm:"min 99 – 102",g:`<p>Los tipos de preguntas se clasifican según lo que hace el evaluado. En las de <b>selección de respuesta</b> elige entre opciones dadas: selección múltiple, apareamiento, selección alterna, falso-verdadero y dependientes de contexto. En las de <b>producción</b> construye la respuesta: completar, ensayo corto, largo u oral, ejecución y productos no escritos.</p>
<p>El ICFES usa cinco tipos de selección de respuesta, con código. <b>Tipo I, SMUR</b>: selección múltiple con única respuesta, cuatro opciones de la A a la D y solo una correcta; es el más usado. <b>Tipo IV, SMMR</b>: selección múltiple con múltiple respuesta; hay cuatro opciones numeradas del 1 al 4 y se marca la combinación de dos: 1 y 2 es A, 2 y 3 es B, 3 y 4 es C, 2 y 4 es D. <b>Tipo VI, SMIS</b>: selección múltiple con información suficiente; hay un problema y dos informaciones, I y II, y no se resuelve el problema, se decide qué información es suficiente y necesaria. <b>Tipo VII, AP</b>: análisis de postulados. Y <b>tipo VIII, AR</b>: análisis de relación, una afirmación y una razón unidas por PORQUE; se evalúa si cada una es verdadera y si la razón explica la afirmación.</p>`,
x:["Claves usuales del tipo VIII: A = ambas verdaderas y la razón explica; B = ambas verdaderas pero no explica; C = afirmación V y razón F; D = afirmación F y razón V; E = ambas falsas.","Estrategia para el tipo VIII: 1) ¿afirmación V o F? 2) ¿razón V o F? 3) solo si ambas son V, ¿la razón es la causa?","Cada tipo de pregunta debe tener sus instrucciones claras."],
p:"'¿En qué tipo de pregunta no se resuelve el problema sino que se decide qué información basta?' → tipo VI, SMIS.",
v:"Corrección de mi guía de estudio de las clases 4 a 6: ahí puse 4 tipos y llamé SMIS 'información suplementaria'. El manual del ICFES dice 5 tipos (I, IV, VI, VII y VIII) y SMIS es 'información suficiente'. Lo correcto es lo del manual."}},

{s:6,t:"Reglas de oro para construir ítems",
h:`<div class="st c2">${C(`<h4><i></i>Enunciado</h4>una sola problemática<br>sin nombres propios<br>en positivo; si hay negación: <b>NO</b>`,'s')}${C(`<h4><i></i>Opciones</h4>cuatro · longitud similar · independientes<br>nunca "todas" ni "ninguna de las anteriores"<br>evitar "siempre" y "nunca"`,'g')}</div>
<div class="formula" style="font-size:18px"><span>Interpretar</span><span class="sub">inferir, concluir</span><span>Argumentar</span><span class="sub">porque</span><span class="n">Proponer</span><span class="sub">hipótesis</span></div>`,
n:{tm:"min 102 – 105",g:`<p>Reglas del manual del ICFES. Sobre el <b>contenido</b>: evitar ítems que confundan (contenido trivial, información irrelevante, opciones ambiguas, diferencias muy finas entre opciones); no evaluar el mismo aspecto con varios ítems; una sola problemática por ítem; nada de posiciones ideológicas, prejuicios ni preguntas por la opinión del evaluado; ítems independientes y originales, no copiados de internet.</p>
<p>Sobre el <b>enunciado</b>: no usar nombres y apellidos de personas, ni nombres de hospitales, empresas o municipios; en vez de "María Martínez del Hospital San Juan", se dice "una paciente de un hospital universitario". Directrices claras, sin textos excesivos, y redactado en positivo; si la negación es necesaria, va en MAYÚSCULA y negrita.</p>
<p>Sobre las <b>opciones</b>: son cuatro; con concordancia gramatical; independientes, sin solaparse ni ser sinónimas; del mismo contenido; de longitud similar; nunca "todas las anteriores", "ninguna de las anteriores" ni "A y B son correctas"; evitar adverbios como siempre, nunca, totalmente; no repetir en la clave palabras del enunciado; y repartir las claves entre A, B, C y D.</p>
<p>Y las competencias que evalúa el ítem: <b>interpretar</b>, dar sentido a un texto o gráfica, con verbos como inferir, deducir o concluir; <b>argumentar</b>, fundamentar el porqué; y <b>proponer</b>, plantear alternativas, predecir, conjeturar o formular hipótesis.</p>`,
x:["La clave no debe delatarse por ser la más larga o la más corta, la más precisa, la más general o la que repite palabras del enunciado.","Revisión sistemática de cada ítem: aspectos formales, pertinencia, relevancia, dificultad y poder discriminativo.","Niveles de dificultad del manual: baja (una variable, una disciplina, problema común; acierta 70–100%), media (dos variables, interdisciplinario; 30–70%), alta (más de dos variables, transdisciplinario, poco frecuente; 10–30%)."],
p:"Si en el examen ven una opción 'todas las anteriores', no es necesariamente la correcta: según estas reglas, ni siquiera debería estar."}},

{s:6,t:"Analizar la prueba",
h:`<div class="st c2">${C(`<h4><i></i>Del ítem</h4><span class="k">dificultad</span>proporción que acierta<br><span class="k">discriminación</span>≥ 0,40 muy bien · &lt; 0,20 no discrimina`,'s')}${C(`<h4><i></i>De la prueba</h4><span class="k">fiabilidad</span>test-retest · formas paralelas<br><span class="k">validez</span>criterio · constructo · contenido`,'g')}</div>
<div class="trap">Discriminación negativa: los mejores fallan más → revisar el ítem o la clave.</div>`,
n:{tm:"min 105 – 107",g:`<p>Una vez aplicada la prueba se analiza en dos niveles. Del <b>ítem</b>: el <b>índice de dificultad</b> es la proporción de personas que respondieron bien, de 0 a 1; entre 90 y 100% de aciertos es demasiado fácil, y entre 0 y 10% demasiado difícil. La <b>capacidad discriminativa</b> dice si el ítem diferencia a quienes dominan el tema de quienes no: funciona bien si quienes aciertan tienen, en promedio, mejor puntaje total. Según Ebel: 0,40 o más discrimina muy bien; de 0,30 a 0,39, bien; de 0,20 a 0,29, suficiente; menos de 0,20, no discrimina. Si es negativa, los de bajo rendimiento acertaron más que los de alto: el ítem está mal formulado, es ambiguo o tiene la clave errada.</p>
<p>De la <b>prueba completa</b>: la <b>fiabilidad</b> se mide con test-retest, la misma prueba dos veces a las mismas personas con un intervalo suficiente para que no recuerden las respuestas, o con formas paralelas, dos versiones equivalentes aplicadas con poco tiempo entre ellas. Y la <b>validez</b> puede ser de criterio, de constructo o de contenido, y se apoya en el juicio de expertos.</p>`,
x:["Análisis de distractores: un distractor que nadie elige no cumple su función; si lo eligen muchos de los mejores estudiantes, hay ambigüedad o error en la clave.","Ejemplo: un ítem con dificultad 0,9 aporta poca información; uno con discriminación −0,18 debe revisarse antes de reutilizarlo."],
p:"Resumen para memorizar: ítem → dificultad y discriminación; prueba → confiabilidad y validez."}},

{s:7,k:"div",t:"Casos y preguntas tipo examen",h:`<p>Respondan en papel. La clave aparece al avanzar.</p><div class="num">7</div>`,
n:{tm:"min 107",g:`<p>Último bloque. Les voy a leer un caso, tienen unos 30 o 40 segundos, cada uno escribe su respuesta, la decimos a mano alzada o en el chat y después muestro la clave. Son ocho preguntas, más o menos minuto y medio cada una.</p>`,x:["13 minutos en total. Si vas muy tarde, haz los casos 2, 3, 5 y 7, que son los más representativos."]}},

{s:7,q:1,t:"Caso 1 · Tipo de educación",
h:`<div class="q st"><div class="stem">Un hospital ofrece a cuidadores un curso de 40 horas sobre manejo de sondas. No exige niveles ni grados y entrega un certificado de aptitud ocupacional. Según las Leyes 115 de 1994 y 1064 de 2006, es educación</div>
<div class="opts"><div><b>A</b>formal, porque tiene un programa estructurado</div><div class="k"><b>B</b>para el trabajo y el desarrollo humano</div><div><b>C</b>informal, porque no conduce a un título</div><div><b>D</b>superior en el nivel técnico profesional</div></div>
<div class="ans"><b>Clave: B.</b> Estructurada, sin niveles ni grados, con certificado y no título.</div></div>`,
n:{tm:"Pregunta 1",g:`<p>Lean el caso con calma. Hay tres pistas: no exige niveles ni grados, es un curso estructurado de 40 horas y entrega un certificado de aptitud ocupacional, no un título. Con el truco "formal título, no formal certificado, informal nada", la respuesta es la B: educación para el trabajo y el desarrollo humano, el antiguo "no formal".</p>`,
x:["A es el distractor por la palabra 'estructurado': la ETDH también es estructurada; lo que no tiene son niveles y grados.","C confunde 'no da título' con 'informal'; la informal tampoco da certificado.","D: un curso de 40 horas no es educación superior."],p:"Clave B."}},

{s:7,q:1,t:"Caso 2 · Clasificar el método",
h:`<div class="q st"><div class="stem">La docente presenta tres casos de pacientes con fiebre alta, dolor articular y erupción. El grupo busca patrones y al final construye la definición y los factores de riesgo del dengue. Según el razonamiento y la construcción del conocimiento, el método es</div>
<div class="opts"><div><b>A</b>deductivo y dogmático</div><div><b>B</b>deductivo y heurístico</div><div class="k"><b>C</b>inductivo y heurístico</div><div><b>D</b>inductivo y dogmático</div></div>
<div class="ans"><b>Clave: C.</b> Va de los casos a la definición (inductivo) y el grupo descubre el concepto (heurístico).</div></div>`,
n:{tm:"Pregunta 2",g:`<p>Aquí piden dos criterios a la vez. Primero, ¿dónde empieza el razonamiento? En tres casos particulares, y termina en una definición general: eso es <b>inductivo</b>. Segundo, ¿cómo llegan al conocimiento? El grupo lo descubre buscando patrones, nadie se lo entrega hecho: eso es <b>heurístico</b>. Clave C.</p>`,
x:["Además es activo: los estudiantes protagonizan.","Si la docente hubiera explicado primero la fisiopatología y luego los casos, sería deductivo."],p:"Clave C."}},

{s:7,q:1,t:"Caso 3 · Elegir la técnica",
h:`<div class="q st"><div class="stem">Una enfermera educadora tiene 36 auxiliares y solo 15 minutos al inicio de una capacitación. Quiere que todos participen y conocer lo que ya saben sobre aislamiento hospitalario. La técnica más adecuada es</div>
<div class="opts"><div><b>A</b>seminario alemán</div><div><b>B</b>técnica expositiva</div><div><b>C</b>debate</div><div class="k"><b>D</b>Phillips 66</div></div>
<div class="ans"><b>Clave: D.</b> Seis grupos de seis, seis minutos, plenaria: todos participan y se exploran saberes previos.</div></div>`,
n:{tm:"Pregunta 3",g:`<p>Las palabras clave: grupo grande, poco tiempo, que todos participen, al inicio y para conocer lo que ya saben. Treinta y seis personas son exactamente seis grupos de seis: <b>Phillips 66</b>. Y como es al inicio para activar saberes previos, es una estrategia pre-instruccional.</p>`,
x:["Seminario alemán: necesita lectura previa y más tiempo.","Expositiva: no hace participar a todos.","Debate: requiere preparar posturas con evidencia."],p:"Clave D."}},

{s:7,q:1,t:"Caso 4 · Análisis de relación",
h:`<div class="q st"><div class="stem"><b>Afirmación:</b> la simulación clínica es una técnica didáctica de entrenamiento<br><b>PORQUE</b><br><b>Razón:</b> en el debriefing el estudiante reflexiona sobre las decisiones que tomó.</div>
<div class="opts"><div><b>A</b>Ambas verdaderas y la razón explica la afirmación</div><div class="k"><b>B</b>Ambas verdaderas, pero la razón no la explica</div><div><b>C</b>Afirmación verdadera, razón falsa</div><div><b>D</b>Afirmación falsa, razón verdadera</div></div>
<div class="ans"><b>Clave: B.</b> Es de entrenamiento porque permite practicar y decidir sin riesgo, no por el debriefing.</div></div>`,
n:{tm:"Pregunta 4",g:`<p>Esta es tipo VIII. Vamos en tres pasos. ¿La afirmación es verdadera? Sí, la simulación está en la familia de entrenamiento. ¿La razón es verdadera? Sí, en el debriefing se reflexiona sobre las decisiones. ¿La razón explica la afirmación? No: la simulación es de entrenamiento porque recrea un escenario para practicar y decidir sin riesgo; el debriefing es una de sus fases, no la causa de que sea de entrenamiento. Clave B.</p>`,
x:["Error frecuente: marcar A solo porque ambas son verdaderas. El tercer paso es el que decide."],p:"Clave B."}},

{s:7,q:1,t:"Caso 5 · Pirámide de Miller",
h:`<div class="q st"><div class="stem">Al final del semestre los estudiantes rotan por 8 estaciones de 7 minutos con pacientes estandarizados y maniquíes; en cada una un evaluador califica con lista de chequeo. ¿Qué nivel de Miller se evalúa principalmente?</div>
<div class="opts"><div><b>A</b>Sabe</div><div><b>B</b>Sabe cómo</div><div class="k"><b>C</b>Muestra cómo</div><div><b>D</b>Hace</div></div>
<div class="ans"><b>Clave: C.</b> Es un ECOE: desempeño demostrado en ambiente simulado y estandarizado.</div></div>`,
n:{tm:"Pregunta 5",g:`<p>Estaciones, tiempo fijo, pacientes estandarizados y lista de chequeo: es un <b>ECOE</b>. El estudiante demuestra lo que sabe hacer, pero en un ambiente simulado. Eso es "muestra cómo". Clave C.</p>`,
x:["La trampa es D: 'hace' es el desempeño real con pacientes reales, evaluado con Mini-CEX, portafolio u observación en la práctica."],p:"Clave C."}},

{s:7,q:1,t:"Caso 6 · El ítem mal construido",
h:`<div class="q st"><div class="stem">"El señor Pedro Pérez, del Hospital San Juan, NO debe recibir… A) heparina B) warfarina C) aspirina D) todas las anteriores". ¿Cuántas reglas del ICFES incumple?</div>
<div class="opts"><div><b>A</b>Ninguna; está bien construido</div><div><b>B</b>Una: los nombres propios</div><div class="k"><b>C</b>Tres: nombres propios, negación sin negrita y "todas las anteriores"</div><div><b>D</b>Dos: la negación y "todas las anteriores"</div></div>
<div class="ans"><b>Clave: C.</b> Sin nombres de personas ni instituciones; negación en MAYÚSCULA y <b>negrita</b>; nunca "todas las anteriores".</div></div>`,
n:{tm:"Pregunta 6",g:`<p>Busquemos los errores uno por uno. Uno: usa nombre y apellido de una persona y el nombre de un hospital, y eso está prohibido. Dos: la negación NO está en mayúscula, pero no en negrita; la regla pide las dos cosas. Tres: la opción D es "todas las anteriores", que nunca se usa. Son tres errores. Clave C.</p>`,
x:["Aprovecha para recordar las otras opciones prohibidas: 'ninguna de las anteriores' y 'A y B son correctas'.","También es mala práctica preguntar en negativo si no es indispensable."],p:"Clave C."}},

{s:7,q:1,t:"Caso 7 · Análisis del ítem",
h:`<div class="q st"><div class="stem">Tras un parcial, el ítem 12 tiene dificultad 0,55 y discriminación −0,18: los estudiantes con mejor puntaje total fallaron más que los de puntaje bajo. La decisión correcta es</div>
<div class="opts"><div><b>A</b>conservarlo, porque su dificultad es media</div><div class="k"><b>B</b>revisar la clave y la redacción antes de reutilizarlo</div><div><b>C</b>conservarlo como ítem de alta dificultad</div><div><b>D</b>usarlo solo en evaluaciones diagnósticas</div></div>
<div class="ans"><b>Clave: B.</b> Discriminación negativa: ítem ambiguo o clave errada.</div></div>`,
n:{tm:"Pregunta 7",g:`<p>La dificultad de 0,55 está bien, es media. Pero la discriminación es negativa: los que más saben fallaron más que los que menos saben. Eso es una alarma: probablemente el ítem es ambiguo o la clave está mal marcada. Hay que revisarlo. Clave B.</p>`,
x:["Recuerda la escala de Ebel: ≥ 0,40 muy bien; 0,30–0,39 bien; 0,20–0,29 suficiente; < 0,20 no discrimina.","La opción A es la trampa: una buena dificultad no compensa una mala discriminación."],p:"Clave B."}},

{s:7,q:1,t:"Caso 8 · Competencia o RAE",
h:`<div class="q st"><div class="stem">"Administra medicamentos por vía intravenosa aplicando los correctos, al paciente adulto hospitalizado en medicina interna." Este enunciado es</div>
<div class="opts"><div><b>A</b>una competencia genérica: pensamiento + conocimiento + contexto</div><div class="k"><b>B</b>un RAE: acción + contenido + contexto</div><div><b>C</b>un objetivo del PEI</div><div><b>D</b>un elemento del currículo oculto</div></div>
<div class="ans"><b>Clave: B.</b> Concreto, observable y verificable: acción, contenido y contexto.</div></div>`,
n:{tm:"Pregunta 8",g:`<p>Miren el verbo: "administra", en presente, una acción observable. Luego el contenido: medicamentos intravenosos aplicando los correctos. Y el contexto: paciente adulto en medicina interna. Es concreto y se puede verificar al final de la asignatura: es un <b>RAE</b>. Clave B.</p>`,
x:["Como competencia sería más amplio: 'Gestionar la terapia farmacológica… para garantizar la seguridad del paciente en servicios de hospitalización'.","Además sería específica (disciplinar), no genérica, así que A falla dos veces."],p:"Clave B."}},

{s:8,t:"Diez ideas para mañana",
h:`<div class="st c2" style="font-size:17px">${C(`<ol style="margin:0;padding-left:20px;line-height:1.7"><li>Formal título · ETDH certificado · informal nada</li><li>Ley 115 básica · Ley 30 superior · Ley 749 ciclos</li><li>Decreto 376: formación continua · Ley 911: R-I-D-P</li><li>Método: camino · técnica: cómo recorrerlo</li><li>Quién · cómo llega · dónde empieza · cómo se ve · cómo se analiza</li></ol>`,'s')}${C(`<ol start="6" style="margin:0;padding-left:20px;line-height:1.7"><li>Competencia: pensamiento + conocimiento + contexto</li><li>RAE: acción + contenido + contexto</li><li>Phillips 66: seis personas, seis minutos</li><li>Miller: el ECOE es "muestra cómo"</li><li>Discriminación negativa: revisar el ítem</li></ol>`,'g')}</div>
<div class="hero" style="text-align:center">¡Éxitos mañana!</div>`,
n:{tm:"min 118 – 120",g:`<p>Para cerrar, diez ideas que se pueden llevar esta noche. Si mañana dudan entre dos opciones, vuelvan a las preguntas: ¿quién protagoniza?, ¿dónde empieza el razonamiento?, ¿cómo se presenta la información? Y en las de análisis de relación, hagan siempre los tres pasos.</p>
<p>Gracias por venir. Mañana a las 7 en la sala digital: lleguen unos minutos antes. ¡Mucho éxito!</p>`,
x:["Ofrece compartir el enlace de esta presentación para que repasen.","Si sobra tiempo, abre preguntas libres."]}}
];


const N=S.length;
const stage=document.getElementById('stage'),box=document.getElementById('box');
document.getElementById('hlogo').src=LOGO;
function sparks(){let s='';for(let i=0;i<18;i++){const x=(i*53)%100,y=20+((i*37)%75),t=5+(i%5),d=(i*0.7)%6;s+=`<span class="spark" style="left:${x}%;top:${y}%;--t:${t}s;--d:${d}s"></span>`}return s}
function slideHTML(x,i){
  const cls='sl'+(x.k==='div'?' div':'')+(x.k==='cover'?' cover':'');
  const foot=x.k?'':`<div class="foot"><span><b>${SECS[x.s].split(' · ')[0]}</b> · ${SECS[x.s].split(' · ')[1]||''}</span><span>Programas de Educación · ${i+1}</span></div>`;
  const deco=x.k==='div'?sparks():(x.k==='cover'?'<i class="glow a" style="left:40%;right:auto"></i>':'<i class="glow a"></i><i class="glow b"></i>');
  let h=x.h;
  if(x.k==='cover') h=h.replace(/<div class="side">[\s\S]*<\/div>$/,'<div class="side"><h3>Contenido</h3><ol>'+SECS.slice(1,8).map(s=>`<li>${s.split(' · ')[1]}</li>`).join('')+'</ol></div>').replace('Tutoría de preparación para el examen final','Repaso de estudio para el examen');
  return `<section class="${cls}">${deco}<img class="logo" src="${LOGO}" alt="Universidad FUCS"><h1>${x.t}</h1>${x.k?h:`<div class="body">${h}</div>`}${foot}</section>`;
}
const skip=t=>/minutos|Si vas|Ofrece|Si sobra|Tiempo total|Bloque de \d|ritmo|ruta|QR|Pide que|Pregunta al grupo|Ejercicio rápido|Aprovecha para/i.test(t);
const clean=h=>h.replace(/<p>Buenas noches[\s\S]*?<\/p>/,'').replace(/<p>La idea de hoy[\s\S]*?<\/p>/,'').replace(/<p>Tengan papel[\s\S]*?<\/p>/,'').replace(/<p>Gracias por venir[\s\S]*?<\/p>/,'').replace(/Para cerrar, diez ideas que se pueden llevar esta noche\. /,'').replace(/Lean el caso con calma\. /,'');
const INTRO=`<p>Este repaso reúne todo lo visto en Programas de Educación durante el semestre: fundamentos y teorías del aprendizaje, sistema educativo y normatividad, proceso de enseñanza-aprendizaje, currículo, competencias y RAE, didáctica y técnicas didácticas, y evaluación y construcción de la prueba objetiva.</p><p>Cada diapositiva trae debajo la explicación completa, los datos que no alcanzan a estar en la diapositiva y la pregunta típica de examen. Al final hay ocho casos tipo examen: intenta responderlos antes de pulsar "Ver respuesta".</p>`;
let cur=0,rev=0;
function fit(){const k=box.clientWidth/1280;stage.style.transform=`scale(${k})`}
function exp(x,i){
  const n=x.n||{};
  if(x.k==='cover')return `<h2>Cómo usar este repaso</h2><div class="g">${INTRO}</div>`;
  const ext=(n.x||[]).filter(t=>!skip(t));
  let h=`<h2>${x.t}</h2><div class="bl">${SECS[x.s]}</div>`;
  if(x.q){
    h+=`<p>Lee el caso y elige tu respuesta antes de mirar la clave.</p><button class="revbtn" id="bRev">${rev?'Ocultar respuesta':'Ver respuesta'}</button>`;
    h+=`<div class="keybox ${rev?'on':''}"><div class="box q"><b>${n.p||''}</b></div><h3>Explicación</h3><div class="g">${clean(n.g||'')}</div>${ext.length?`<h3>Por qué las otras opciones no son</h3><ul>${ext.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}</div>`;
    return h;
  }
  h+=`<h3>Explicación</h3><div class="g">${clean(n.g||'')}</div>`;
  if(ext.length)h+=`<div class="box more"><h3 style="margin-top:0">Para profundizar</h3><ul>${ext.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  if(n.p)h+=`<div class="box q"><b>Pregunta típica:</b> ${n.p}</div>`;
  if(n.v)h+=`<div class="box v"><b>Para confirmar con la docente:</b> ${n.v}</div>`;
  return h;
}
function paint(anim){
  const x=S[cur];
  if(anim){stage.innerHTML=slideHTML(x,cur);const el=stage.firstElementChild;requestAnimationFrame(()=>el.classList.add('in'))}
  stage.firstElementChild.classList.toggle('rev',!!rev);
  document.getElementById('exp').innerHTML=exp(x,cur);
  const b=document.getElementById('bRev');if(b)b.onclick=()=>{rev=rev?0:1;paint(false)};
  document.getElementById('pos').textContent=`${cur+1} / ${N}`;
  document.getElementById('prog').style.width=((cur+1)/N*100)+'%';
  document.getElementById('bPrev').disabled=cur===0;document.getElementById('bNext').disabled=cur===N-1;
  document.querySelectorAll('#idxList a').forEach(a=>a.classList.toggle('cur',+a.dataset.i===cur));
  fit();
}
function go(i){i=Math.max(0,Math.min(N-1,i));if(i===cur)return;cur=i;rev=0;paint(true);scrollTo({top:0,behavior:'smooth'});try{history.replaceState(null,'','#d'+(cur+1))}catch(e){}}
document.getElementById('bNext').onclick=()=>go(cur+1);
document.getElementById('bPrev').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}else if(e.key==='Escape')idx.classList.remove('on')});
/* índice */
const idx=document.getElementById('idx');let lst='',last=-1;
S.forEach((x,i)=>{if(x.s!==last){lst+=`<h4>${SECS[x.s]}</h4>`;last=x.s}lst+=`<a href="#d${i+1}" data-i="${i}">${i+1}. ${x.t}</a>`});
document.getElementById('idxList').innerHTML=lst;
document.getElementById('idxList').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();idx.classList.remove('on');go(+a.dataset.i)});
document.getElementById('bIdx').onclick=()=>idx.classList.add('on');
document.getElementById('bX').onclick=()=>idx.classList.remove('on');
idx.addEventListener('click',e=>{if(e.target===idx)idx.classList.remove('on')});
addEventListener('resize',fit);
const m=/^#d(\d+)$/.exec(location.hash);cur=m?Math.max(0,Math.min(N-1,+m[1]-1)):0;
paint(true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
}
</script>
</body>
